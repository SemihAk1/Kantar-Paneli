<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantar Paneli · Marvoe Crusher</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE8E0;--bg2:#F5F2EC;--card:#FFFFFF;--cardSoft:#FBF9F4;
  --ink:#211E18;--ink2:#4A453C;--dim:#8A8377;--faint:#B2AB9D;
  --line:#E3DED4;--line2:#EEEAE2;
  --bronze:#9A7327;--gold:#C99A35;--gold2:#E7BE5C;
  --green:#3E9D6A;--greenSoft:rgba(62,157,106,.12);
  --amber:#D9952E;--amberSoft:rgba(217,149,46,.14);--red:#C25149;--redSoft:rgba(194,81,73,.12);
  --slate:#5E7689;--plum:#8A6B9E;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;--sans:'Archivo','Segoe UI',system-ui,sans-serif;
  --sh-sm:0 1px 3px rgba(33,30,24,.05),0 4px 10px -4px rgba(33,30,24,.08);
  --sh:0 4px 12px -4px rgba(33,30,24,.10),0 14px 34px -14px rgba(33,30,24,.16);
  --sh-lg:0 12px 28px -10px rgba(33,30,24,.14),0 34px 64px -22px rgba(33,30,24,.24);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(150% 90% at 92% -8%,rgba(201,154,53,.10),transparent 52%),
    radial-gradient(120% 80% at -8% 8%,rgba(94,118,137,.06),transparent 48%),var(--bg);min-height:100vh}
.num{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.02em}
.up{text-transform:uppercase;letter-spacing:.15em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}

/* ===== header ===== */
.hdr{display:flex;align-items:center;gap:15px;padding:12px 28px;background:rgba(255,255,255,.78);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hdr::before{content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,154,53,.18),transparent 65%);pointer-events:none;z-index:0}
.logoimg{height:42px;width:auto;display:block;cursor:pointer;transition:.2s;position:relative;z-index:1}
.logoimg:hover{transform:scale(1.05)}
.hdr .ttl{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.hdr .sub{font-size:9px;color:var(--dim);margin-top:1px;white-space:nowrap}
.navarrows{display:flex;gap:4px;margin-left:8px}
.navarrow{width:34px;height:34px;border-radius:9px;background:var(--cardSoft);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink2);transition:.14s}
.navarrow:hover:not(:disabled){background:#fff;color:var(--bronze);border-color:var(--gold)}
.navarrow:disabled{opacity:.3;cursor:default}
.navbtns{display:flex;gap:4px}
.navbtn{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink2);transition:.15s;white-space:nowrap}
.navbtn:hover{background:var(--cardSoft);color:var(--bronze)}
.navbtn.act{background:rgba(154,115,39,.12);color:var(--bronze);font-weight:700}
.hdr .tools{margin-left:auto;display:flex;align-items:center;gap:12px}
.langsw{display:flex;gap:3px;background:var(--cardSoft);border:1px solid var(--line);border-radius:30px;padding:3px}
.langbtn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;color:var(--dim);transition:.14s}
.langbtn:hover{color:var(--ink)} .langbtn.on{background:#fff;color:var(--bronze);box-shadow:var(--sh-sm)}
.datapill{display:flex;align-items:center;gap:10px;background:var(--cardSoft);border:1px solid var(--line);border-radius:30px;padding:6px 7px 6px 14px;transition:.15s;cursor:pointer}
.datapill:hover{border-color:var(--gold)}
.datapill .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--amberSoft);flex:none}
.datapill.live .dot{background:var(--green);box-shadow:0 0 0 3px var(--greenSoft);animation:pulse 2.4s ease-in-out infinite}
.datapill.busy .dot{background:var(--gold);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(62,157,106,0)}}
.datapill .dtxt{font-size:10.5px;line-height:1.25;color:var(--dim);white-space:nowrap}
.datapill .dtxt b{color:var(--ink);font-weight:700;display:block;font-size:11px}
.datapill .dbtn{background:var(--ink);color:#fff;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;white-space:nowrap;transition:.14s}
.datapill .dbtn:hover{background:var(--bronze)}

.wrap{max-width:1340px;margin:0 auto;padding:22px 30px 70px}
.crumbs{display:flex;align-items:center;gap:5px;font-size:12.5px;flex-wrap:wrap;min-height:30px}
.crumb{color:var(--dim);font-weight:600;padding:5px 12px;border-radius:8px;transition:.14s}
.crumb:not(.cur){cursor:pointer} .crumb:not(.cur):hover{color:var(--ink);background:#fff}
.crumb.cur{color:var(--bronze);background:rgba(154,115,39,.1)} .csep{color:var(--faint)}

/* ===== period bar ===== */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.perbar{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.segs{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--sh-sm)}
.segs button{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:.14s}
.segs button:hover{color:var(--bronze);background:var(--cardSoft)}
.segs button.on{background:var(--ink);color:#fff}
.dates{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px 8px;box-shadow:var(--sh-sm)}
.dates input{border:none;outline:none;font-size:11.5px;font-family:var(--mono);color:var(--ink);background:none;padding:3px 2px}
.dates span{color:var(--faint)}
.perinfo{font-size:10.5px;color:var(--dim);width:100%;text-align:right;margin-top:-4px}

.sechead{display:flex;align-items:baseline;gap:12px;margin:28px 0 15px}
.sechead h2{font-size:11px;font-weight:700;color:var(--dim)} .sechead .line{flex:1;height:1px;background:var(--line)} .sechead .hint{font-size:11px;color:var(--faint)}

/* ===== KPI ===== */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.kpi{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:16px;
  padding:15px 18px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;opacity:0;transform:translateY(10px);
  animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;min-width:0}
.kpi .klab{font-size:9px;color:var(--dim);display:flex;align-items:center;gap:6px;font-weight:700}
.kpi .klab i{width:7px;height:7px;border-radius:50%}
.kpi .kval{font-size:29px;font-weight:800;margin-top:6px;line-height:1;white-space:nowrap}
.kpi .kval small{font-size:12px;color:var(--faint);font-weight:600;margin-left:3px}
.kpi .ksub{font-size:10.5px;color:var(--dim);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ksub b{color:var(--ink);font-weight:700}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;font-family:var(--mono)}
.delta.pos{color:var(--green);background:var(--greenSoft)} .delta.neg{color:var(--red);background:var(--redSoft)} .delta.zero{color:var(--dim);background:var(--line2)}
.kspark{display:flex;gap:2px;align-items:flex-end;height:28px;margin-top:9px}
.kspark span{flex:1;border-radius:2px 2px 0 0;min-height:2px;background:var(--gold);opacity:.75;height:0;animation:growH .7s ease forwards}
.kspark span:last-child{opacity:1;background:var(--bronze)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes grow{to{width:var(--w)}}
@keyframes growH{to{height:var(--h)}}

/* ===== panels ===== */
.pan{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--sh-sm);
  opacity:0;animation:rise .55s ease forwards;min-width:0;position:relative}
.pan h3{font-size:10px;color:var(--dim);font-weight:700;margin-bottom:4px}
.pan .psub{font-size:10.5px;color:var(--faint);margin-bottom:14px}
.panhead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.minisegs{display:flex;background:var(--cardSoft);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.minisegs button{padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:700;color:var(--dim)}
.minisegs button.on{background:#fff;color:var(--bronze);box-shadow:var(--sh-sm)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.grid21{display:grid;grid-template-columns:2.1fr 1fr;gap:18px;margin-top:18px}
.grid12{display:grid;grid-template-columns:1fr 1.6fr;gap:18px;margin-top:18px}
.mt18{margin-top:18px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:2px 0 10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink2);font-weight:600;cursor:pointer;user-select:none;transition:.14s}
.lg i{width:10px;height:10px;border-radius:3px}
.lg.off{opacity:.35}
.lgtools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.lgtools .lgt{font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--dim);margin-right:2px}
.lgtools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:10.5px;font-weight:700;color:var(--ink2);transition:.14s}
.lgtools button:hover:not(:disabled){border-color:var(--gold);color:var(--bronze)}
.lgtools button:disabled{opacity:.4;cursor:default}
.lgtools .lgh{font-size:10px;color:var(--faint);margin-left:4px}
.lg.off i{background:var(--faint)!important}

/* chart */
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.ax{font-family:var(--mono);font-size:10px;fill:#A39C8E}
.tip{position:fixed;display:none;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);
  padding:10px 13px;min-width:170px;max-width:300px;font-size:11.5px;z-index:200;pointer-events:none}
.tip .th{font-weight:800;font-size:12px;margin-bottom:6px;color:var(--ink)}
.tip .tr{display:flex;align-items:center;gap:7px;padding:2px 0;color:var(--ink2)}
.tip .tr i{width:9px;height:9px;border-radius:2px;flex:none}
.tip .tr b{margin-left:auto;font-family:var(--mono);color:var(--ink);font-weight:700;padding-left:12px}
.tip .tt{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);display:flex;color:var(--dim)}
.tip .tt b{margin-left:auto;font-family:var(--mono);color:var(--bronze);font-weight:800}

/* material cards */
.mcards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.mcard{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;background:linear-gradient(165deg,#fff,var(--cardSoft));
  border:1px solid var(--line);box-shadow:var(--sh-sm);padding:15px 16px 14px;
  opacity:0;transform:translateY(12px);animation:rise .5s ease forwards;transition:transform .18s,box-shadow .18s,border-color .18s;min-width:0}
.mcard::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--mc)}
.mcard::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,var(--mc),transparent 60%);opacity:.07;pointer-events:none}
.mcard:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--mc) 45%,transparent)}
.mcard .mn{font-size:13.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mn i{width:9px;height:9px;border-radius:3px;background:var(--mc);flex:none}
.mcard .mt{font-size:24px;font-weight:800;margin-top:9px;line-height:1}
.mcard .mt small{font-size:10.5px;color:var(--faint);font-weight:600;margin-left:3px}
.mcard .msh{position:absolute;right:13px;top:13px;font-size:10.5px;font-weight:800;font-family:var(--mono);color:var(--ink2);background:var(--line2);padding:2px 8px;border-radius:20px}
.mcard .mbar{height:5px;background:#EFEBE2;border-radius:3px;overflow:hidden;margin:10px 0 9px}
.mcard .mbar div{height:100%;background:var(--mc);border-radius:3px;width:0;animation:grow .8s ease forwards}
.mcard .mm{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);gap:6px}
.mcard .mm b{display:block;color:var(--ink);font-weight:700;font-size:11.5px;font-family:var(--mono)}
.mcard .mgo{position:absolute;right:14px;bottom:12px;font-size:11px;font-weight:800;color:var(--mc);opacity:0;transition:.2s}

/* last day card */
.lastday{background:linear-gradient(160deg,#2A261F,#3B342A);color:#fff;border-radius:18px;padding:20px 22px;box-shadow:var(--sh);position:relative;overflow:hidden;
  opacity:0;animation:rise .55s ease forwards;min-width:0}
.lastday::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(231,190,92,.28),transparent 65%)}
.lastday h3{font-size:9.5px;color:rgba(255,255,255,.6);font-weight:700}
.lastday .ldd{font-size:13px;font-weight:700;color:var(--gold2);margin-top:3px}
.lastday .ldt{font-size:40px;font-weight:900;line-height:1;margin-top:14px}
.lastday .ldt small{font-size:13px;color:rgba(255,255,255,.6);font-weight:600;margin-left:4px}
.lastday .ldrow{display:flex;gap:8px;margin-top:14px}
.lastday .ldst{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:8px 11px;min-width:0}
.lastday .ldst .v{font-size:16px;font-weight:800;line-height:1.1}
.lastday .ldst .l{font-size:8px;color:rgba(255,255,255,.6);margin-top:3px;font-weight:700}
.lastday .ldbars{margin-top:16px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.ldbar{display:grid;grid-template-columns:96px 1fr 58px;gap:9px;align-items:center;font-size:10.5px}
.ldbar .n{color:rgba(255,255,255,.85);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldbar .b{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.ldbar .b span{display:block;height:100%;border-radius:3px;width:0;animation:grow .8s ease forwards}
.ldbar .v{text-align:right;font-family:var(--mono);font-weight:700}
.ldhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.ldnow,.ldper{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;white-space:nowrap;transition:.14s}
.ldnow:hover,.ldper:hover{background:var(--gold2);color:#2A261F;border-color:var(--gold2)}
.ldper{margin-top:9px}
.ld7wrap{display:flex;align-items:stretch;gap:6px;margin-top:16px;position:relative;z-index:1}
.ldarr{width:22px;flex:none;border-radius:7px;background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:700;transition:.14s}
.ldarr:hover:not(:disabled){background:rgba(255,255,255,.2)}
.ldarr:disabled{opacity:.25;cursor:default}
.ld7{display:flex;align-items:flex-end;gap:5px;height:92px;flex:1}
.ld7 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end;cursor:pointer;border-radius:7px;padding:3px 2px;transition:.14s;min-width:0}
.ld7 div:hover{background:rgba(255,255,255,.08)}
.ld7 div.na{cursor:default;opacity:.3}
.ld7 div b{font-size:8.5px;font-family:var(--mono);color:rgba(255,255,255,.55);font-weight:600;white-space:nowrap}
.ld7 span{width:100%;border-radius:3px 3px 0 0;background:rgba(255,255,255,.25);min-height:2px;transition:.2s}
.ld7 div:hover span{background:rgba(255,255,255,.45)}
.ld7 div.inr{background:rgba(231,190,92,.06)}.ld7 div.inr span{background:rgba(231,190,92,.45)}
.ld7 div.sel{background:rgba(231,190,92,.14);box-shadow:inset 0 0 0 1px rgba(231,190,92,.5)}
.ld7 div.sel span{background:var(--gold2)}
.ld7 div.sel b{color:var(--gold2)}
.ld7 em{font-style:normal;font-size:8.5px;color:rgba(255,255,255,.5);font-family:var(--mono);line-height:1.2}
.ld7 em.dn{color:rgba(255,255,255,.8);font-weight:700}
.ldlast{margin-top:12px;font-size:10px;color:rgba(255,255,255,.55);position:relative;z-index:1}
.ldlast b{color:#fff;font-family:var(--mono)}

/* horizontal bar rows */
.hbars{display:flex;flex-direction:column;gap:4px}
.hrow{display:grid;grid-template-columns:var(--lw,150px) minmax(0,1fr) 118px;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;cursor:pointer;transition:.14s}
.hrow:hover{background:var(--cardSoft);box-shadow:inset 0 0 0 1px var(--line)}
.hrow .hn{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.hrow .hn i{width:8px;height:8px;border-radius:2px;flex:none}
.hrow .ht{height:16px;display:flex;gap:1px;border-radius:5px;overflow:hidden;background:transparent}
.hrow .ht span{display:block;height:100%;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.hrow .ht span:last-child{border-radius:0 5px 5px 0}
.hrow .hv{text-align:right;font-family:var(--mono);font-weight:700;font-size:12px;white-space:nowrap}
.hrow .hv small{display:block;font-size:9.5px;color:var(--faint);font-weight:500}
.hscroll{max-height:560px;overflow-y:auto;padding-right:4px}

/* heatmap */
.hm{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font-family:var(--mono)}
.hm .hl{font-size:9.5px;color:var(--dim);display:flex;align-items:center;font-family:var(--sans);font-weight:700}
.hm .hh{font-size:8.5px;color:var(--faint);text-align:center;padding-bottom:2px}
.hm .hc{aspect-ratio:1/1;border-radius:3px;min-width:0;transition:transform .12s;cursor:default}
.hm .hc:hover{transform:scale(1.25);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink);position:relative;z-index:2}
.hmscale{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:9.5px;color:var(--dim);justify-content:flex-end}
.hmscale span{width:120px;height:7px;border-radius:4px;background:linear-gradient(90deg,#F3EEE3,#E7BE5C,#9A7327,#4A3610)}
.shiftband{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;margin-top:4px;font-size:8.5px;font-weight:700;letter-spacing:.08em}
.shiftband div{text-align:center;border-radius:3px;padding:2px 0}

/* matrix */
.mxwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.mx{border-collapse:separate;border-spacing:2px;font-size:11px;width:100%}
table.mx th{font-size:9px;color:var(--dim);font-weight:700;padding:6px 6px;text-align:right;white-space:nowrap;letter-spacing:.04em}
table.mx th.rh{text-align:left}
table.mx thead th{vertical-align:bottom;padding:4px 0 8px;text-align:center}
table.mx thead th.rh{text-align:left}
table.mx thead th .vt{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;white-space:nowrap;font-size:9.5px;letter-spacing:.03em;line-height:1;text-align:left}
table.mx td{font-family:var(--mono);text-align:center;padding:6px 7px;border-radius:5px;white-space:nowrap;cursor:pointer;transition:outline .1s;min-width:46px}
table.mx td:hover{outline:2px solid var(--ink);outline-offset:-1px}
table.mx td.z{color:var(--faint);cursor:default} table.mx td.z:hover{outline:none}
table.mx td.tot,table.mx th.tot{background:var(--line2);font-weight:800;color:var(--ink)}
table.mx tr.tot td{background:var(--line2);font-weight:800}
table.mx td.go{cursor:pointer}
table.mx td.go:hover{outline:2px solid var(--bronze);outline-offset:-1px;color:var(--bronze)}
table.mx thead th[data-hl]:hover .vt{color:var(--bronze)}

/* tables */

.srch{flex:1;min-width:180px;max-width:320px;display:flex;align-items:center;gap:8px;background:var(--cardSoft);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

.clearbtn{background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-size:11.5px;font-weight:600;transition:.14s;white-space:nowrap}

.ghostbtn{background:var(--cardSoft);border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:8px 14px;font-size:11.5px;font-weight:700;transition:.14s;white-space:nowrap}
.ghostbtn:hover{border-color:var(--gold);color:var(--bronze)}
.tblscroll{max-height:640px;overflow:auto}
table.lst{width:100%;border-collapse:collapse;font-size:12px}
table.lst thead th{text-align:left;color:var(--dim);font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;cursor:pointer;white-space:nowrap;user-select:none}
table.lst thead th:hover{color:var(--bronze)}
table.lst thead th .ar{opacity:.5;margin-left:3px}

table.lst th.r,table.lst td.r{text-align:right}
table.lst tbody td{padding:9px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.lst tbody tr:hover{background:var(--cardSoft)}
table.lst tbody tr.click{cursor:pointer}
td.code{font-family:var(--mono);color:var(--bronze);font-weight:600} td.dim{color:var(--dim)} td.mono{font-family:var(--mono)}
td.strong{font-weight:800;font-family:var(--mono)}
.colfilt{width:100%;min-width:60px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 8px;font-size:11px;color:var(--ink);outline:none;transition:.14s}
.colfilt:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,154,53,.15)}
.colfilt::placeholder{color:var(--faint);font-size:10px}
table.lst tfoot td{position:sticky;bottom:0;background:linear-gradient(180deg,#F3EEE4,#EDE6D8);padding:10px 14px;font-size:11.5px;font-weight:700;border-top:2px solid var(--gold);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:2px 9px 2px 7px;border-radius:20px;background:var(--cardSoft);border:1px solid var(--line2)}
.tag i{width:7px;height:7px;border-radius:2px}
.pager{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:var(--cardSoft);border-radius:8px;padding:5px 11px;font-weight:700;font-size:11px;color:var(--ink2)}

.pager button:not(:disabled):hover{border-color:var(--gold);color:var(--bronze)}
.minibar{display:inline-block;width:70px;height:5px;background:#EFEBE2;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}

.achips{display:flex;gap:7px;flex-wrap:wrap}

/* detail hero */
.dhero{display:grid;grid-template-columns:340px 1fr;gap:18px}

  opacity:0;animation:rise .5s ease forwards}
.dcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--dc)}
.dcard::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 110%,var(--dc),transparent 62%);opacity:.15;pointer-events:none}
.dcard .dk{font-size:9.5px;color:var(--dim);font-weight:700}
.dcard .dn{font-size:28px;font-weight:900;letter-spacing:-.02em;margin-top:4px;line-height:1.1;word-break:break-word}
.dcard .dt{font-size:44px;font-weight:900;line-height:1;margin-top:22px}
.dcard .dt small{font-size:13px;color:var(--faint);font-weight:600;margin-left:4px}
.dcard .dshare{margin-top:10px;font-size:11px;color:var(--dim)}
.dcard .dshare b{color:var(--ink)}
.dcard .dsb{height:7px;background:#EFEBE2;border-radius:4px;overflow:hidden;margin-top:8px}
.dcard .dsb div{height:100%;background:var(--dc);width:0;animation:grow .9s ease forwards}
.dkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(28,25,20,.6);backdrop-filter:blur(5px);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}

.badge{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--green);background:var(--greenSoft);padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.autorow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sw{width:42px;height:23px;border-radius:14px;background:#D8D2C6;position:relative;transition:.25s;flex:none}
.sw.on{background:var(--green)} .sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.25s cubic-bezier(.4,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on::after{left:21px}
.howto{margin-top:14px;font-size:11px;color:var(--dim);line-height:1.6}
.howto b{color:var(--ink2)}
.qual{margin-top:12px;font-size:11px;color:var(--dim)}

/* drop + loader + toast */
.dropzone{position:fixed;inset:0;z-index:400;background:rgba(154,115,39,.18);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;pointer-events:none}

.dropzone div{background:#fff;border:2px dashed var(--gold);border-radius:20px;padding:30px 44px;font-size:16px;font-weight:800;color:var(--bronze);box-shadow:var(--sh-lg)}
.loader{position:fixed;inset:0;z-index:500;background:rgba(236,232,224,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}

.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--bronze);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader .lt{font-weight:800;font-size:14px}
.loader .ls{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.toasts{position:fixed;right:22px;bottom:22px;z-index:600;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:12px;box-shadow:var(--sh-lg);max-width:420px;animation:tin .3s ease;display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--red)} .toast.ok{background:#2F6F4D}
.toast b{font-weight:800}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.banner{display:none;align-items:center;gap:12px;background:#FFF6E3;border:1px solid rgba(217,149,46,.45);color:#7A5410;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:12px;font-weight:600}

.banner button{margin-left:auto}
.gate{display:flex;justify-content:center;padding:40px 0 60px}
.gcard2{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-lg);padding:34px 36px;max-width:440px;width:100%;text-align:center;animation:rise .5s ease forwards;opacity:0}
.gcard2 .glogo{height:56px;margin:0 auto 14px;display:block}
.gcard2 h2{font-size:22px;font-weight:900;letter-spacing:-.02em}

.gcard2 label{display:block;text-align:left;font-size:11px;font-weight:700;color:var(--ink2);margin:12px 0 0}
.gcard2 input{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;font-family:var(--mono);background:#fff;outline:none}
.gcard2 input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,154,53,.15)}
.clearbtn.big{margin-top:18px;padding:12px 20px;font-size:13px;width:100%}
.msbtn{display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;border:1px solid #8C8C8C;border-radius:4px;padding:12px 18px;font-size:14px;font-weight:600;color:#5E5E5E;font-family:'Segoe UI',system-ui,sans-serif;transition:.14s}

.gerr{color:var(--red)!important;font-weight:600;font-size:12px!important}
.redir{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;text-align:left;font-size:11px;color:var(--dim)}

.rptbtn{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink2);box-shadow:var(--sh-sm);transition:.14s;white-space:nowrap}

.expbtn{position:absolute;top:12px;right:12px;z-index:5;display:inline-flex;gap:4px;opacity:0;transition:.15s}

.pan.hasexp .panhead{padding-right:150px}.tblcard.hasexp .tbh{padding-right:160px}.lastday.hasexp .ldhead{padding-right:150px}

.rpage>.expbtn{display:none}
/* rapor */
.rptbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.rpthint{font-size:11px;color:var(--dim);margin-left:6px}
.rpage{background:#fff;max-width:900px;margin:0 auto;border-radius:6px;box-shadow:var(--sh-lg);padding:34px 40px 26px;color:var(--ink);position:relative}

.rbar{display:block;height:6px;background:#EFEBE2;border-radius:3px;overflow:hidden}.rbar span{display:block;height:100%;background:var(--gold);border-radius:3px}
.rfoot{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:9px;color:var(--faint);text-align:center}

@media(max-width:760px){.rsec{overflow-x:auto}.rtbl{min-width:520px}.rchart{overflow:hidden}.rptbar .rpthint{display:none}.rpage{padding:20px 16px}.rhead{grid-template-columns:auto 1fr}.rhead dl{grid-column:1/-1;text-align:left}.rkpis{grid-template-columns:repeat(2,1fr)}.rmx{font-size:9px}}
.rwrap{width:100%;border-collapse:collapse}.rwrap>thead>tr>td,.rwrap>tfoot>tr>td,.rwrap>tbody>tr>td.rbody{padding:0;border:none}.rsp{height:0}
@page{size:A4;margin:0}

  html,body{background:#fff!important}

  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;animation:none!important}
  .pan,.kpi,.mcard{opacity:1!important;transform:none!important}
}
.empty{padding:40px;text-align:center;color:var(--faint);font-size:12.5px}

.view-enter{animation:viewIn .4s cubic-bezier(.2,.7,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#D8D2C6;border-radius:5px} ::-webkit-scrollbar-track{background:transparent}

  .hdr{flex-wrap:wrap;padding:10px 16px}.hdr .tools{margin-left:0;width:100%;justify-content:space-between}.wrap{padding:16px 16px 60px}.perbar{margin-left:0}.opts{grid-template-columns:1fr}.dkpis{grid-template-columns:1fr 1fr}}

.appsw{position:relative;display:flex;align-items:center;gap:10px;padding:5px 10px 5px 8px;margin-left:-8px;border-radius:13px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .15s}

  DS.matOrder=[...tot.keys()].sort((a,b)=>tot[b]-tot[a]);
  return DS;
}

const PAL=['#C99A35','#3D6FB0','#3E9D6A','#8A55B8','#D9772B','#1F9AA8','#C2414F','#7F9A2A','#B0578E','#8E6A1E'];
const KNOWN=['15-40 MM','9-40 MM','0-100 MM','0-5 MM','5-15 MM','MIXED MATERIAL','15-25 MM','0-15 MM BYPASS','4-9 MM','0-15 MM'];

  const free=PAL.filter((_,j)=>j>=KNOWN.length);return i<free.length?free[i]:'#9A9488';}

/* --------- kodlama (gömülü veri & önbellek) --------- */
function encodeDS(DS){
  const c={};const dl=a=>{const o=new Array(a.length);let p=0;for(let i=0;i<a.length;i++){o[i]=a[i]-p;p=a[i];}return o;};
  c.day=dl(DS.day);c.cd=Array.from(DS.cal,(v,i)=>v-DS.day[i]);c.min=Array.from(DS.min);c.mat=Array.from(DS.mat);c.loc=Array.from(DS.loc);c.plt=Array.from(DS.plt);c.usr=Array.from(DS.usr);
  c.net=Array.from(DS.net);c.w1=Array.from(DS.w1);c.w2=Array.from(DS.w2);c.rec=dl(DS.rec);c.xr=dl(DS.xr);
  return {v:2,n:DS.n,dict:DS.dict,meta:DS.meta,c};
}
function decodeDS(o){
  const n=o.n,c=o.c,un=(a,T_)=>{const t=new T_(n);let p=0;for(let i=0;i<n;i++){p+=a[i];t[i]=p;}return t;};
  const DS={n,dict:o.dict,meta:o.meta};
  DS.day=un(c.day,Int32Array);DS.cal=new Int32Array(n);for(let i=0;i<n;i++)DS.cal[i]=DS.day[i]+c.cd[i];
  DS.min=Int16Array.from(c.min);DS.mat=Uint16Array.from(c.mat);DS.loc=Uint16Array.from(c.loc);DS.plt=Uint16Array.from(c.plt);DS.usr=Uint16Array.from(c.usr);
  DS.net=Int32Array.from(c.net);DS.w1=Int32Array.from(c.w1);DS.w2=Int32Array.from(c.w2);DS.rec=un(c.rec,Int32Array);DS.xr=un(c.xr,Int32Array);
  return finalize(DS);
}

function select(f){
  f=f||{};const from=f.from!=null?f.from:PER.from,to=f.to!=null?f.to:PER.to;
  const mat=f.mat!=null?f.mat:-1,loc=f.loc!=null?f.loc:-1,plt=f.plt!=null?f.plt:-1,usr=f.usr!=null?f.usr:-1;
  const out=new Int32Array(DS.n);let k=0;const D=DS.day,M=DS.mat,L=DS.loc,P=DS.plt,U=DS.usr;
  for(let i=0;i<DS.n;i++){const d=D[i];if(d<from||d>to)continue;if(mat>=0&&M[i]!==mat)continue;if(loc>=0&&L[i]!==loc)continue;if(plt>=0&&P[i]!==plt)continue;if(usr>=0&&U[i]!==usr)continue;out[k++]=i;}
  return out.subarray(0,k);
}
function groupSum(ix,dim){
  const K=DS.dict[dim].length,t=new Float64Array(K),c=new Int32Array(K),A=DS[dim],N=DS.net;
  for(let j=0;j<ix.length;j++){const i=ix[j];t[A[i]]+=N[i];c[A[i]]++;}
  const out=[];for(let k=0;k<K;k++)if(c[k])out.push({id:k,name:DS.dict[dim][k],ton:t[k]/1000,trips:c[k]});
  return out.sort((a,b)=>b.ton-a.ton);
}
function cross(ix,d1,d2){ // d1 x d2 -> Map id1 -> Float64Array(K2) ton
  const K2=DS.dict[d2].length,m=new Map(),A=DS[d1],B=DS[d2],N=DS.net,C=new Map();
  for(let j=0;j<ix.length;j++){const i=ix[j];let a=m.get(A[i]);if(!a){a=new Float64Array(K2);m.set(A[i],a);C.set(A[i],new Int32Array(K2));}a[B[i]]+=N[i]/1000;C.get(A[i])[B[i]]++;}
  return {ton:m,trips:C};
}
function stats(ix){
  let t=0,mx=0;const days=new Set(),pl=new Set();
  for(let j=0;j<ix.length;j++){const i=ix[j];t+=DS.net[i];if(DS.net[i]>mx)mx=DS.net[i];days.add(DS.day[i]);pl.add(DS.plt[i]);}
  return {ton:t/1000,trips:ix.length,avg:ix.length?t/1000/ix.length:0,max:mx/1000,days:days.size,veh:pl.size};
}
function medianLoad(ix){if(!ix.length)return 0;const a=new Float64Array(ix.length);for(let j=0;j<ix.length;j++)a[j]=DS.net[ix[j]];a.sort();return a[Math.floor(a.length/2)]/1000;}

/* zaman serisi */
function autoGran(){const span=PER.to-PER.from+1;return span<=62?'day':span<=200?'week':'month';}
function bucketOf(day,gran){if(gran==='day')return day;if(gran==='week')return day-sDow(day);return sYM(day);}
function bucketKeys(gran){
  const keys=[];
  if(gran==='day'){for(let d=PER.from;d<=PER.to;d++)keys.push(d);}
  else if(gran==='week'){for(let d=PER.from-sDow(PER.from);d<=PER.to;d+=7)keys.push(d);}
  else{for(let ym=sYM(PER.from);ym<=sYM(PER.to);ym++)keys.push(ym);}
  return keys;
}
function bucketLabel(k,gran,long){if(gran==='day')return long?fDate(k)+' · '+T('wdl')[sDow(k)]:fDateS(k);if(gran==='week')return long?T('weekOf')+' '+fDate(k):fDateS(k);return long?T('mo')[k%12]+' '+Math.floor(k/12):fYM(k);}
function series(ix,gran,dim){
  const keys=bucketKeys(gran),pos=new Map(keys.map((k,i)=>[k,i]));
  const K=dim?DS.dict[dim].length:1,vals=Array.from({length:K},()=>new Float64Array(keys.length)),trips=new Int32Array(keys.length);
  const dowCache=new Map();
  for(let j=0;j<ix.length;j++){const i=ix[j],d=DS.day[i];let b;
    if(gran==='day')b=d;else if(gran==='week'){let w=dowCache.get(d);if(w===undefined){w=sDow(d);dowCache.set(d,w);}b=d-w;}else{let w=dowCache.get(d);if(w===undefined){w=sYM(d);dowCache.set(d,w);}b=w;}
    const p=pos.get(b);if(p===undefined)continue;vals[dim?DS[dim][i]:0][p]+=DS.net[i]/1000;trips[p]++;}
  return {keys,vals,trips};
}

function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}

/* Sütun (zaman) grafiği: yığılı çubuk + opsiyonel hareketli ortalama çizgisi */
function colChart(el,o){
  const draw=()=>{
    const W=Math.max(300,el.clientWidth),H=o.height||290,m={l:46,r:10,t:10,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b,n=o.labels.length;
    const S=o.series.filter(s=>!s.off);
    const tot=new Float64Array(n);S.forEach(s=>{for(let i=0;i<n;i++)tot[i]+=s.values[i];});
    let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,tot[i]);if(o.line)o.line.values.forEach(v=>{if(v!=null)mx=Math.max(mx,v);});
    const max=niceMax(mx*1.04),y=v=>m.t+ih-(v/max)*ih,bw=iw/Math.max(n,1),gap=bw>14?Math.min(bw*.28,10):bw>5?Math.max(1,bw*.18):0,bwi=Math.max(.6,bw-gap);
    let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
    for(let t=0;t<=4;t++){const v=max*t/4,yy=Math.round(y(v))+.5;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="${t?'#EEEAE2':'#D8D2C6'}"/><text class="ax" x="${m.l-8}" y="${yy+3.5}" text-anchor="end">${shortN(v)}</text>`;}
    const minLbl=o.labelW||46,step=Math.max(1,Math.ceil(minLbl/bw));
    for(let i=0;i<n;i+=step){const x=m.l+i*bw+bw/2;s+=`<text class="ax" x="${x}" y="${H-8}" text-anchor="middle">${esc(o.labels[i])}</text>`;}
    s+='<g class="bars">';
    for(let i=0;i<n;i++){
      let acc=0;const x=m.l+i*bw+gap/2;const segs=[];
      S.forEach(se=>{const v=se.values[i];if(v>0){segs.push([se.color,acc,v]);acc+=v;}});
      segs.forEach((g,gi)=>{const y0=y(g[1]),y1=y(g[1]+g[2]);let h=y0-y1;const top=gi===segs.length-1;const sep=(!top&&h>3&&bwi>2)?1.5:0;h=Math.max(.5,h-sep);
        const r=top?Math.min(3,bwi/2,h):0;const yt=y0-sep-h;
        if(r>0.5)s+=`<path d="M${x},${y0-sep}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+bwi-r}Q${x+bwi},${yt} ${x+bwi},${yt+r}V${y0-sep}Z" fill="${g[0]}" data-i="${i}"/>`;
        else s+=`<rect x="${x}" y="${yt}" width="${bwi}" height="${h}" fill="${g[0]}" data-i="${i}"/>`;});
    }
    s+='</g>';
    if(o.line){let d='';o.line.values.forEach((v,i)=>{if(v==null)return;const x=m.l+i*bw+bw/2;d+=(d?'L':'M')+x.toFixed(1)+','+y(v).toFixed(1);});
      s+=`<path d="${d}" fill="none" stroke="#211E18" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".78"/>`;}
    s+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="#211E18" stroke-dasharray="3 3" opacity="0"/>`;
    s+=`<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" style="cursor:${o.onClick?'pointer':'crosshair'}"/></svg>`;
    el.innerHTML=s;
    const svg=el.querySelector('svg'),xh=svg.querySelector('.xh'),bars=svg.querySelector('.bars'),hit=svg.querySelector('.hit');
    const idxAt=e=>{const r=svg.getBoundingClientRect();return Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left-m.l)/bw)));};
    let last=-1;
    hit.addEventListener('mousemove',e=>{const i=idxAt(e);if(i!==last){last=i;const cx=m.l+i*bw+bw/2;xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('opacity',.35);
        bars.querySelectorAll('[data-i]').forEach(b=>b.setAttribute('opacity',+b.dataset.i===i?1:.45));}
      showTip(o.tip(i),e);});
    hit.addEventListener('mouseleave',()=>{last=-1;hideTip();xh.setAttribute('opacity',0);bars.querySelectorAll('[data-i]').forEach(b=>b.removeAttribute('opacity'));});
    if(o.onClick)hit.addEventListener('click',e=>o.onClick(idxAt(e)));
  };
  draw();onResize(draw);return draw;
}

function summaryRows(ix,dim){
  const K=DS.dict[dim].length,t=new Float64Array(K),c=new Int32Array(K),first=new Int32Array(K).fill(2e9),last=new Int32Array(K).fill(-1),tare=new Float64Array(K),tc=new Int32Array(K);
  const days=Array.from({length:K},()=>null);
  const om=dim==='mat'?'loc':'mat',ol=dim==='loc'?'plt':(dim==='plt'?'loc':'plt');
  const cntA=new Map(),cntB=new Map();
  for(let j=0;j<ix.length;j++){const i=ix[j],k=DS[dim][i];t[k]+=DS.net[i];c[k]++;const ts=DS.cal[i]*1440+Math.max(0,DS.min[i]);if(ts<first[k])first[k]=ts;if(ts>last[k])last[k]=ts;
    (days[k]||(days[k]=new Set())).add(DS.day[i]);
    const tw=DS.w1[i]&&DS.w2[i]?Math.min(DS.w1[i],DS.w2[i]):0;if(tw){tare[k]+=tw;tc[k]++;}
    let a=cntA.get(k);if(!a){a=new Map();cntA.set(k,a);}a.set(DS[om][i],(a.get(DS[om][i])||0)+DS.net[i]);
    let b=cntB.get(k);if(!b){b=new Map();cntB.set(k,b);}b.set(DS[ol][i],(b.get(DS[ol][i])||0)+DS.net[i]);}
  const topOf=(m,d)=>{if(!m)return '—';let bk=-1,bv=-1;m.forEach((v,k)=>{if(v>bv){bv=v;bk=k;}});return DS.dict[d][bk];};
  const tot=t.reduce((a,b)=>a+b,0)||1;const out=[];
  for(let k=0;k<K;k++)if(c[k])out.push({id:k,name:DS.dict[dim][k],ton:t[k]/1000,trips:c[k],avg:t[k]/1000/c[k],share:t[k]/tot*100,days:days[k].size,perDay:c[k]/days[k].size,
    first:first[k],last:last[k],tare:tc[k]?tare[k]/tc[k]/1000:null,topA:topOf(cntA.get(k),om),topB:topOf(cntB.get(k),ol)});
  return {rows:out,om,ol};
}

    ch.querySelectorAll('.x').forEach(x=>x.onclick=()=>{delete UI.recF[x.dataset.k];refresh(true);});
    card.querySelector('#clr').disabled=!Object.keys(F).some(k=>F[k]!=null&&F[k]!=='');
  };
  const refresh=(full)=>{arr=recFiltered();if(full){card.querySelector('.tblscroll').innerHTML=`<table class="lst">${head()}<tbody></tbody><tfoot></tfoot></table>`;wire();}body();};
  const wire=()=>{
    card.querySelectorAll('thead tr:first-child th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;UI.recSort=UI.recSort.k===k?{k,d:-UI.recSort.d}:{k,d:-1};UI.recPage=0;refresh(true);});
    card.querySelectorAll('select.colfilt').forEach(s=>s.onchange=()=>{const k=s.dataset.f;if(s.value==='')delete UI.recF[k];else UI.recF[k]=+s.value;UI.recPage=0;refresh(false);renderChipsOnly();});
    let tm;card.querySelectorAll('input.colfilt').forEach(inp=>inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{const k=inp.dataset.q;if(k==='plt')delete UI.recF.plt;UI.recF['q_'+k]=inp.value.trim();UI.recPage=0;refresh(false);},220);});
  };
  const renderChipsOnly=()=>{};
  card.querySelector('#clr').onclick=()=>{UI.recF={};UI.recPage=0;refresh(true);};

function exportCSV(arr){
  const H=['KAYIT NO','VARDIYA TARIHI','TARIH','SAAT','PLAKA NO','MALZEME','GITTIGI YER','1.TARTIM','2.TARTIM','NET (kg)','NET (t)','KULLANICI'];

  const lines=[H.join(';')];
  arr.forEach(i=>lines.push([DS.rec[i]||'',fDate(DS.day[i]),fDate(DS.cal[i]),fMin(DS.min[i]),DS.dict.plt[DS.plt[i]],DS.dict.mat[DS.mat[i]],DS.dict.loc[DS.loc[i]],DS.w1[i]||'',DS.w2[i]||'',DS.net[i],(DS.net[i]/1000).toFixed(2).replace('.',','),DS.dict.usr[DS.usr[i]]].map(q).join(';')));
  const b=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`kantar_kayitlari_${isoOf(PER.from)}_${isoOf(PER.to)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

function toast(html,cls,ms){const t=el(`<div class="toast ${cls||''}">${html}</div>`);document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.transition='.3s';t.style.opacity=0;setTimeout(()=>t.remove(),300);},ms||4200);}
function loader(on,t,s){const L=document.getElementById('loader');L.classList.toggle('on',!!on);if(t!=null)document.getElementById('loadT').textContent=t;document.getElementById('loadS').textContent=s||'';}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function parseFile(file){
  if(/\.xls$/i.test(file.name))throw new Error('XLS');
  loader(true,T('reading'),file.name+' · '+fmt(file.size/1048576,1)+' MB');await sleep(30);
  const buf=await file.arrayBuffer();
  return parseBuffer(buf,{file:file.name,modified:file.lastModified||Date.now()},true);
}
async function parseBuffer(buf,meta,showLoader){
  const wb=await XL.workbook(buf);
  let sh=wb.sheets.find(s=>normH(s.name)==='DATA')||wb.sheets[0];
  if(showLoader){loader(true,T('parsing'),sh.name);await sleep(20);}
  let rows;try{rows=await XL.rows(wb,sh,20);var ds=buildDataset(rows,{});}
  catch(e){ // DATA bulunamazsa diğer sayfaları dene
    let ok=null;for(const s of wb.sheets){if(s===sh)continue;try{const r=await XL.rows(wb,s,20);ok=buildDataset(r,{});sh=s;break;}catch(_){}}
    if(!ok)throw new Error('FMT');ds=ok;}
  ds.meta=Object.assign(ds.meta,meta,{sheet:sh.name,loadedAt:Date.now()});
  return ds;
}
async function applyNew(ds,source,silent){
  const prevN=DS?DS.n:0,prevMax=DS?DS.maxDay:null,wasAllOrLatest=!DS||PER.key!=='custom';
  ds.meta.source=source;DS=ds;
  if(wasAllOrLatest||prevMax!==ds.maxDay){if(PER.key==='custom'){PER.from=Math.max(PER.from,DS.minDay);PER.to=Math.min(PER.to,DS.maxDay);}else [PER.from,PER.to]=presetRange(PER.key);}
  IDB.set('cache',encodeDS(DS));
  render();updatePill();
  const diff=DS.n-prevN;
  if(!silent)toast(`<b>${T('loaded')}</b> · ${fmt(DS.n)} ${T('rows')}${prevN&&diff>0?` · <b>+${fmt(diff)}</b> ${T('newRows')}`:''}`,'ok');
}
async function loadFromFile(file,source,silent){
  try{const ds=await parseFile(file);loader(false);await applyNew(ds,source,silent);return true;}
  catch(e){loader(false);console.error(e);toast(e.message==='XLS'?T('errXls'):e.message==='FMT'?T('errFmt'):T('errRead'),'err',6500);return false;}
}
const FS_OK=typeof window.showOpenFilePicker==='function';
async function linkFile(){
  if(!FS_OK){toast(T('noFS'),'err',6000);return;}
  try{const [h]=await window.showOpenFilePicker({multiple:false,types:[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx','.xlsm']}}]});
    LINK.handle=h;await IDB.set('handle',h);const f=await h.getFile();const ok=await loadFromFile(f,'live');if(ok){LINK.lastMod=f.lastModified;LINK.lastCheck=Date.now();LINK.state='live';await IDB.set('lastMod',LINK.lastMod);}
    startWatch();updatePill();closeSrc();}catch(e){if(e.name!=='AbortError'){console.error(e);toast(T('errRead'),'err');}}
}
async function checkLinked(force,gesture){
  if(!LINK.handle)return;
  try{
    let perm=await LINK.handle.queryPermission({mode:'read'});
    if(perm!=='granted'){if(!gesture){LINK.state='perm';updatePill();return;}perm=await LINK.handle.requestPermission({mode:'read'});if(perm!=='granted'){LINK.state='perm';updatePill();return;}}
    LINK.state='live';const f=await LINK.handle.getFile();LINK.lastCheck=Date.now();
    if(force||f.lastModified!==LINK.lastMod){const ok=await loadFromFile(f,'live',!force&&!LINK.lastMod);if(ok){LINK.lastMod=f.lastModified;await IDB.set('lastMod',LINK.lastMod);}}
    else if(force)toast(T('noChange'));
    updatePill();
  }catch(e){console.error(e);if(e.name==='NotFoundError'){LINK.state='lost';}updatePill();if(gesture||force)toast(T('errRead'),'err');}
}

const NET={on:false,stamp:null,lastCheck:0,timer:null,busy:false,warned:false};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>{s.remove();res();};s.onerror=()=>{s.remove();rej(new Error('NET'));};document.head.appendChild(s);});}
async function b64ToBuf(b64){
  try{const r=await fetch('data:application/octet-stream;base64,'+b64);if(r.ok)return await r.arrayBuffer();}catch(e){}
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;
}
async function netCheck(initial,manual){
  if(NET.busy)return;NET.busy=true;
  try{
    let st=null;
    if(IS_WEB){let r;try{r=await fetch('data/stamp.json?t='+Date.now(),{cache:'no-store'});}catch(e){throw new Error('NET');}if(!r.ok)throw new Error('NET');st=await r.json().catch(()=>null);}
    else{window.KANTAR_STAMP=null;await loadScript('kantar_veri_stamp.js?v='+Date.now());st=window.KANTAR_STAMP;}
    if(!st||!st.id)throw new Error('NET');
    NET.on=true;NET.stamp=st;NET.lastCheck=Date.now();
    if(st.ok===false&&!NET.warned){NET.warned=true;toast(T('netErr')+(st.error?': '+esc(st.error):''),'err',8000);}
    if(!DS||!DS.n||st.id!==DS.meta.netId){
      setBusy(true);
      let d,buf;
      if(IS_WEB){
        if(!DS||!DS.n)loader(true,T('webLoading'),fmt((st.size||0)/1048576,1)+' MB');
        let r;try{r=await fetch('data/kantar.xlsx?v='+encodeURIComponent(st.id),{cache:'no-store'});}catch(e){throw new Error('NETDATA');}
        if(!r.ok)throw new Error('NETDATA');buf=await r.arrayBuffer();d={name:st.name,modified:st.modified,id:st.id};
        if(!DS||!DS.n)loader(true,T('parsing'),'');
      }else{
        window.KANTAR_XLSX=null;await loadScript('kantar_veri.js?v='+encodeURIComponent(st.id));
        d=window.KANTAR_XLSX;window.KANTAR_XLSX=null;if(!d||!d.b64)throw new Error('NETDATA');
        buf=await b64ToBuf(d.b64);}
      const ds=await parseBuffer(buf,{file:d.name||'TOTAL_LIST.xlsx',modified:Date.parse(d.modified)||Date.now(),netId:d.id||st.id},false);
      loader(false);
      const quiet=initial&&(!DS||!DS.n||DS.meta.source==='embedded');
      await applyNew(ds,'net',quiet);
    }else if(manual)toast(T('noChange'));
  }catch(e){
    loader(false);
    if(e.message==='NETDATA'||e.message==='FMT'){console.error(e);if(manual||!NET.warned){NET.warned=true;toast(T('netErr'),'err',7000);}}
    else if(e.message==='NET'&&NET.on&&manual)toast(T('netLost'),'err',7000);
    if(initial&&e.message==='NET')NET.on=false;
  }finally{NET.busy=false;setBusy(false);updatePill();if(IS_WEB&&(!DS||!DS.n))render();}
}

/* ---------- token ---------- */
function clTok(){return LS.get('tok',null);}
function clSaveTok(j){
  const old=clTok()||{};let id=old.id||null;
  if(j.id_token){try{const p=JSON.parse(decodeURIComponent(escape(atob(j.id_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));id={name:p.name||'',upn:p.preferred_username||p.upn||''};}catch(e){}}
  LS.set('tok',{at:j.access_token,exp:Date.now()+(+j.expires_in||3600)*1000,rt:j.refresh_token||old.rt||null,id});
}
async function clTokenPost(params){
  const r=await fetch(clAuthBase()+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(Object.assign({client_id:CL.cfg.clientId,scope:CL_SCOPE},params))});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.error||('HTTP '+r.status)),{code:j.error||'token'});return j;
}
async function clToken(force){
  const t=clTok();if(!t)return null;
  if(!force&&t.at&&t.exp-120000>Date.now())return t.at;
  if(!t.rt)return null;
  try{const j=await clTokenPost({grant_type:'refresh_token',refresh_token:t.rt});clSaveTok(j);return j.access_token;}
  catch(e){if(e.code==='invalid_grant'||e.code==='interaction_required'){const o=clTok();if(o){o.at=null;o.rt=null;LS.set('tok',o);}}if(!navigator.onLine)throw Object.assign(new Error('offline'),{code:'offline'});return null;}
}
async function clLogin(silent){
  const v=rnd(48),st=rnd(16),ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  ss.set('pkce',{v,st,silent:!!silent,hash:location.hash,route:ROUTE});
  const t=clTok(),p={client_id:CL.cfg.clientId,response_type:'code',redirect_uri:clRedirect(),response_mode:'query',scope:CL_SCOPE,state:st,code_challenge:ch,code_challenge_method:'S256'};
  if(silent)p.prompt='none';else p.prompt='select_account';
  if(t&&t.id&&t.id.upn)p.login_hint=t.id.upn;
  location.assign(clAuthBase()+'/authorize?'+new URLSearchParams(p));
}
async function clHandleRedirect(){
  const q=new URLSearchParams(location.search);if(!q.has('code')&&!q.has('error'))return false;
  const pk=ss.get('pkce');ss.del('pkce');
  history.replaceState(null,'',clRedirect()+(pk&&pk.hash||''));
  if(pk&&pk.route)ROUTE=pk.route;
  if(q.has('error')){if(pk&&pk.silent)ss.set('silentFail',1);else CL.authErr=q.get('error_description')||q.get('error');return true;}
  if(!pk||pk.st!==q.get('state')){CL.authErr='state mismatch';return true;}
  try{clSaveTok(await clTokenPost({grant_type:'authorization_code',code:q.get('code'),redirect_uri:clRedirect(),code_verifier:pk.v}));ss.del('silentFail');}
  catch(e){CL.authErr=e.message;}
  return true;
}
function clLogout(){

/* ---------- Graph ---------- */
async function clGraph(path,retry){
  const at=await clToken(false);if(!at)throw Object.assign(new Error('auth'),{code:'auth'});
  let r;try{r=await fetch('https://graph.microsoft.com/v1.0'+path,{headers:{Authorization:'Bearer '+at}});}catch(e){throw Object.assign(new Error('offline'),{code:'offline'});}
  if(r.status===401&&!retry){await clToken(true);return clGraph(path,true);}
  if(r.status===429||r.status===503){const ra=+(r.headers.get('Retry-After')||5);if(!retry){await sleep(Math.min(30,ra)*1000);return clGraph(path,true);}}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw Object.assign(new Error((j.error&&j.error.message)||('HTTP '+r.status)),{code:'http'+r.status});}
  return r.json();
}
async function clItem(){
  const ref=LS.get('cloudref',null);
  if(ref&&ref.url===CL.cfg.fileUrl){try{return await clGraph('/drives/'+encodeURIComponent(ref.d)+'/items/'+encodeURIComponent(ref.i));}catch(e){if(e.code!=='http404'&&e.code!=='http403')throw e;}}
  const it=await clGraph('/shares/u!'+strB64u(CL.cfg.fileUrl.trim())+'/driveItem');
  if(it&&it.parentReference)LS.set('cloudref',{url:CL.cfg.fileUrl,d:it.parentReference.driveId,i:it.id});
  return it;
}
async function clDownload(it){
  const u=it['@microsoft.graph.downloadUrl'];
  if(u){const r=await fetch(u);if(r.ok)return r.arrayBuffer();}
  const at=await clToken(false);const ref=LS.get('cloudref',{});
  const r=await fetch('https://graph.microsoft.com/v1.0/drives/'+encodeURIComponent(ref.d)+'/items/'+encodeURIComponent(ref.i)+'/content',{headers:{Authorization:'Bearer '+at}});
  if(!r.ok)throw Object.assign(new Error('HTTP '+r.status),{code:'http'+r.status});return r.arrayBuffer();
}
async function clCheck(initial,manual){

  }finally{CL.busy=false;setBusy(false);updatePill();if(!DS||!DS.n)render();}
}

/* ---------- DOM → JPEG (kütüphanesiz: stilleri satır içine kopyala → SVG foreignObject → canvas) ---------- */
const EXP_DROP='.expbtn,.minisegs,.lgtools,.ldarr,.ldnow,.ldper,.ghostbtn,.clearbtn,.pager';
let FONTCSS=null;
async function fontCSS(){
  if(FONTCSS!==null)return FONTCSS;FONTCSS='';
  try{
    const link=document.querySelector('link[href*="fonts.googleapis"]');if(!link)return '';
    const css=await (await fetch(link.href)).text();const re=/\/\*\s*([\w-]+)\s*\*\/\s*@font-face\s*\{([^}]*)\}/g;let m;const faces=[],urls=new Map();
    while((m=re.exec(css))){if(m[1]!=='latin'&&m[1]!=='latin-ext')continue;const u=(m[2].match(/url\(([^)]+)\)/)||[])[1];if(!u)continue;faces.push([m[2],u]);urls.set(u,null);}
    await Promise.all([...urls.keys()].map(async u=>{const b=await (await fetch(u)).blob();urls.set(u,await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);}));}));
    FONTCSS=faces.map(([body,u])=>'@font-face{'+body.replace(u,urls.get(u))+'}').join('');
  }catch(e){console.warn('font embed',e);FONTCSS='';}
  return FONTCSS;
}
const SKIP_PROPS=/^(animation|transition|will-change|cursor|pointer-events|-webkit-user|user-select|caret|outline)/;
function styledClone(src){
  const clone=src.cloneNode(true);
  const walk=(s,c)=>{
    if(s.nodeType!==1)return;
    if(s.matches&&s.matches(EXP_DROP)){c.remove();return;}
    const cs=getComputedStyle(s);let txt='';
    for(let i=0;i<cs.length;i++){const p=cs[i];if(SKIP_PROPS.test(p))continue;txt+=p+':'+cs.getPropertyValue(p)+';';}
    txt+='animation:none;transition:none;';
    c.setAttribute('style',txt);
    if(c.tagName==='INPUT')c.setAttribute('value',s.value);
    if(c.tagName==='SELECT'){const o=c.querySelector('option[value="'+CSS.escape(s.value)+'"]');if(o)o.setAttribute('selected','selected');}
    ['::before','::after'].forEach(ps=>{const pc=getComputedStyle(s,ps),ct=pc.content;if(!ct||ct==='none'||ct==='normal')return;
      const e=document.createElement('span');let t='';for(let i=0;i<pc.length;i++){const p=pc[i];if(SKIP_PROPS.test(p))continue;t+=p+':'+pc.getPropertyValue(p)+';';}
      e.setAttribute('style',t+'animation:none;');e.textContent=ct.replace(/^["']|["']$/g,'').replace(/^none$/,'');ps==='::before'?c.insertBefore(e,c.firstChild):c.appendChild(e);});
    const sk=[...s.childNodes],ck=[...c.childNodes];
    for(let i=0;i<sk.length;i++)walk(sk[i],ck[i]);
  };
  walk(src,clone);
  return clone;
}
async function nodeToBlob(node,type){
  // kaydırmalı alanları tam boy aç
  const opened=[];node.querySelectorAll('.tblscroll,.hscroll,.mxwrap').forEach(x=>{opened.push([x,x.style.maxHeight,x.style.overflow]);x.style.maxHeight='none';x.style.overflow='visible';});
  const W=Math.ceil(node.scrollWidth),H=Math.ceil(node.scrollHeight);
  const clone=styledClone(node);
  opened.forEach(([x,m,o])=>{x.style.maxHeight=m;x.style.overflow=o;});
  clone.style.margin='0';clone.style.transform='none';clone.style.opacity='1';clone.style.width=W+'px';clone.style.height=H+'px';
  const pad=24,bw=W+pad*2,bh=H+pad*2;
  const fc=await fontCSS();
  const xml=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${bw}" height="${bh}"><foreignObject x="${pad}" y="${pad}" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml">${fc?`<style>${fc.replace(/</g,'')}</style>`:''}${xml}</div></foreignObject></svg>`;
  const img=new Image();img.decoding='sync';
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('img'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
  let sc=2;while(bw*bh*sc*sc>32e6&&sc>1)sc-=.25;
  const cv=document.createElement('canvas');cv.width=Math.round(bw*sc);cv.height=Math.round(bh*sc);
  const g=cv.getContext('2d');g.fillStyle='#ECE8E0';g.fillRect(0,0,cv.width,cv.height);g.scale(sc,sc);g.drawImage(img,0,0);
  const blob=await new Promise(r=>cv.toBlob(r,type,.93));if(!blob)throw new Error('blob');
  return blob;
}
function busyToast(){const t=el(`<div class="toast">${T('expBusy')}</div>`);document.getElementById('toasts').appendChild(t);return t;}
async function nodeToJpeg(node,name){
  const t=busyToast();await sleep(30);
  try{
    const blob=await nodeToBlob(node,'image/jpeg');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.jpg';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    t.remove();toast(T('expDone'),'ok',2500);
  }catch(e){console.error(e);t.remove();toast(T('expErr'),'err');}
}
const CAN_COPY=!!(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext);
async function nodeToClipboard(node){
  const t=busyToast();
  try{
    // ClipboardItem'a Promise verilir → kullanıcı tıklaması geçerliliğini korur (Safari dahil). Pano yalnızca PNG kabul eder.
    const p=sleep(30).then(()=>nodeToBlob(node,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':p})]);
    t.remove();toast(T('expCopied'),'ok',3000);
  }catch(e){console.error(e);t.remove();toast(T('expCopyErr'),'err',5000);}
}

    daily=`<section class="rsec"><h2>${T('rptDaily')}</h2><table class="rtbl"><thead><tr><th>${T('cDate')}</th><th>${LANG==='en'?'Day':'Gün'}</th><th class="r">${T('cTon')}</th><th></th><th class="r">${T('cTrips')}</th><th>${T('cTopMat')}</th></tr></thead><tbody>

      </tbody><tfoot><tr><td colspan="2">${T('total').toUpperCase()}</td><td class="r mono">${fmt(s.ton,1)}</td><td></td><td class="r mono">${fmt(s.trips)}</td><td></td></tr></tfoot></table></section>`;
  }
