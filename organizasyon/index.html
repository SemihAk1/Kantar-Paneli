<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Organizasyon Şeması · Plant Mechanical Maintenance</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE8E0;--bg2:#F5F2EC;--card:#FFFFFF;--cardSoft:#FBF9F4;
  --ink:#211E18;--ink2:#4A453C;--dim:#8A8377;--faint:#B2AB9D;
  --line:#E3DED4;--line2:#EEEAE2;
  --bronze:#9A7327;--gold:#C99A35;--gold2:#E7BE5C;
  --green:#3E9D6A;--greenSoft:rgba(62,157,106,.12);
  --amber:#D9952E;--amberSoft:rgba(217,149,46,.14);--red:#C25149;--redSoft:rgba(194,81,73,.12);
  --slate:#5E7689;--plum:#8A6B9E;--plumSoft:rgba(138,107,158,.13);
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;--sans:'Archivo','Segoe UI',system-ui,sans-serif;
  --sh-sm:0 1px 3px rgba(33,30,24,.05),0 4px 10px -4px rgba(33,30,24,.08);
  --sh:0 4px 12px -4px rgba(33,30,24,.10),0 14px 34px -14px rgba(33,30,24,.16);
  --sh-lg:0 12px 28px -10px rgba(33,30,24,.14),0 34px 64px -22px rgba(33,30,24,.24);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(150% 90% at 92% -8%,rgba(201,154,53,.10),transparent 52%),
    radial-gradient(120% 80% at -8% 8%,rgba(94,118,137,.06),transparent 48%),var(--bg);min-height:100vh}
.num{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.02em}
.up{text-transform:uppercase;letter-spacing:.15em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.hdr{display:flex;align-items:center;gap:15px;padding:12px max(28px,env(safe-area-inset-right,0px)) 12px max(28px,env(safe-area-inset-left,0px));
  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logoimg{height:42px;width:auto;display:block;cursor:pointer}
.hdr .ttl{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.hdr .sub{font-size:9px;color:var(--dim);margin-top:1px;white-space:nowrap}
.navbtns{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.navbtn{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink2);transition:.15s;white-space:nowrap}
.navbtn:hover{background:var(--cardSoft);color:var(--bronze)}
.navbtn.act{background:rgba(154,115,39,.12);color:var(--bronze);font-weight:700}
.navbtn .bdg{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;line-height:16px}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langsw{display:flex;gap:3px;background:var(--cardSoft);border:1px solid var(--line);border-radius:30px;padding:3px}
.langbtn{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;color:var(--dim)}
.langbtn.on{background:#fff;color:var(--bronze);box-shadow:var(--sh-sm)}
.datapill{display:flex;align-items:center;gap:10px;background:var(--cardSoft);border:1px solid var(--line);border-radius:30px;padding:6px 14px 6px 14px}
.datapill .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--amberSoft);flex:none}
.datapill.live .dot{background:var(--green);box-shadow:0 0 0 3px var(--greenSoft);animation:pulse 2.4s ease-in-out infinite}
.datapill.err .dot{background:var(--red);box-shadow:0 0 0 3px var(--redSoft)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(62,157,106,0)}}
.datapill .dtxt{font-size:10.5px;line-height:1.25;color:var(--dim);white-space:nowrap}
.datapill .dtxt b{color:var(--ink);font-weight:700;display:block;font-size:11px}
.resetbtn{display:flex;align-items:center;gap:8px;background:linear-gradient(160deg,var(--gold),var(--bronze));color:#fff;border-radius:12px;padding:10px 16px;
  font-size:12px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 16px -6px rgba(154,115,39,.6);transition:.15s;white-space:nowrap}
.resetbtn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(154,115,39,.7)}
.resetbtn svg{width:16px;height:16px}

.wrap{max-width:1340px;margin:0 auto;padding:22px max(30px,env(safe-area-inset-right,0px)) 70px max(30px,env(safe-area-inset-left,0px))}
.sechead{display:flex;align-items:baseline;gap:12px;margin:26px 0 14px}
.sechead h2{font-size:11px;font-weight:700;color:var(--dim)} .sechead .line{flex:1;height:1px;background:var(--line)} .sechead .hint{font-size:11px;color:var(--faint)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--amberSoft);border:1px solid rgba(217,149,46,.35);color:#7a5513;border-radius:14px;padding:11px 15px;font-size:12px;font-weight:600;margin-bottom:16px}
.notice.stale{background:var(--redSoft);border-color:rgba(194,81,73,.35);color:#8a2f28}

/* KPI */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.kpi{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:var(--sh-sm);
  position:relative;overflow:hidden;min-width:0;cursor:pointer;transition:transform .16s,box-shadow .16s;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--kc)}
.kpi .klab{font-size:9px;color:var(--dim);display:flex;align-items:center;gap:6px;font-weight:700}
.kpi .klab i{width:7px;height:7px;border-radius:50%;background:var(--kc)}
.kpi .kval{font-size:30px;font-weight:800;margin-top:6px;line-height:1;white-space:nowrap;color:var(--kv,var(--ink))}
.kpi .kval small{font-size:12px;color:var(--faint);font-weight:600;margin-left:4px}
.kpi .ksub{font-size:10.5px;color:var(--dim);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ksub b{color:var(--ink);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* panels */
.pan{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--sh-sm);min-width:0;position:relative;animation:rise .55s ease both}
.pan h3{font-size:10px;color:var(--dim);font-weight:700;margin-bottom:4px}
.pan .psub{font-size:10.5px;color:var(--faint);margin-bottom:14px}
.panhead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.grid21{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.minisegs{display:flex;background:var(--cardSoft);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.minisegs button{padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:700;color:var(--dim);white-space:nowrap}
.minisegs button.on{background:#fff;color:var(--bronze);box-shadow:var(--sh-sm)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:20px;white-space:nowrap;color:var(--pc);background:var(--pb)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.st-OVERDUE{--pc:var(--red);--pb:var(--redSoft)} .st-DUE{--pc:#B87512;--pb:var(--amberSoft)} .st-OK{--pc:var(--green);--pb:var(--greenSoft)}
.st-CHECK{--pc:var(--plum);--pb:var(--plumSoft)} .st-NOBASE{--pc:var(--slate);--pb:rgba(94,118,137,.12)}

/* urgent list */
.urg{display:flex;flex-direction:column;gap:2px}
.urow{display:grid;grid-template-columns:100px minmax(0,1fr) minmax(70px,120px) minmax(150px,auto);gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:10px}
.urow:hover{background:#fff}
.urow:last-child{border-bottom:0}
.tagt{font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:-.02em}
.desc{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem{font-family:var(--mono);font-weight:800;text-align:right;font-size:14px;min-width:0}
.urow>*{min-width:0}
.urow .rem .due{white-space:normal}
.rem small{display:block;font-size:9.5px;font-weight:600;color:var(--faint);letter-spacing:0}
.rem.neg{color:var(--red)} .rem.due{color:#B87512}
.bar{height:6px;background:#EFEBE2;border-radius:4px;overflow:hidden}
.bar div{height:100%;border-radius:4px;background:var(--green)}
.bar.w div{background:var(--amber)} .bar.x div{background:var(--red)}
.empty{padding:28px 10px;text-align:center;color:var(--faint);font-size:12px}

/* breakdown bars */
.brk{display:flex;flex-direction:column;gap:11px}
.brow .bl{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:5px}
.brow .bl span{color:var(--dim);font-family:var(--mono);font-weight:600;font-size:10.5px}
.stack{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#EFEBE2}
.stack i{display:block;height:100%}

/* table */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 12px;box-shadow:var(--sh-sm)}
.search input{border:none;outline:none;flex:1;min-width:0;background:none;font-size:12.5px}
.sel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 10px;box-shadow:var(--sh-sm);font-weight:600;color:var(--ink2)}
.cnt{font-size:11px;color:var(--dim);font-family:var(--mono);margin-left:auto}
.tblwrap{overflow-x:auto;border-radius:14px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:900px}
table.t th{position:sticky;top:0;background:var(--bg2);text-align:left;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#fff}
table.t td.r,table.t th.r{text-align:right}
table.t .sm{font-size:10.5px;color:var(--dim)}
.more{text-align:center;margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:11.5px;font-weight:700;color:var(--ink2);box-shadow:var(--sh-sm)}
.btn:hover{border-color:var(--gold);color:var(--bronze)}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--line2);color:var(--ink2);margin:1px 3px 1px 0;white-space:nowrap}
.chip.g{background:rgba(201,154,53,.16);color:var(--bronze)}

/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(33,30,24,.42);backdrop-filter:blur(3px);display:none;z-index:100}
.ov.on{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(620px,100%);background:var(--bg);overflow:auto;box-shadow:var(--sh-lg);
  padding:22px max(22px,env(safe-area-inset-right,0px)) 40px 22px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.xbtn{float:right;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--ink2)}
.dt{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.03em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px;margin:14px 0}
.kv dt{color:var(--dim)} .kv dd{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tcard .tn{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tcard .tv{font-family:var(--mono);font-size:20px;font-weight:800;margin-top:6px}
.tcard .ts{font-size:10.5px;color:var(--dim);margin-top:2px}
.hitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:8px}
.hitem .hh{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--dim)}
.hitem .hb{font-size:12px;margin-top:3px}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;
  background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-lg);padding:24px;animation:rise .25s ease}
.modal.big{width:min(860px,calc(100% - 24px));height:calc(100% - 40px);display:flex;flex-direction:column;padding:16px}
.modal h4{font-size:17px;font-weight:800;letter-spacing:-.01em}
.modal p{color:var(--dim);font-size:12px;margin-top:6px}
.pwrow{display:flex;gap:10px;margin-top:18px}
.pwrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;background:#fff}
.gbtn{background:var(--ink);color:#fff;border-radius:12px;padding:11px 18px;font-size:12.5px;font-weight:800;white-space:nowrap}
.gbtn:hover{background:var(--bronze)}
.err{color:var(--red);font-weight:700;font-size:12px;margin-top:10px;min-height:18px}
.formhead{display:flex;align-items:center;gap:10px;padding:4px 4px 12px;flex-wrap:wrap}
.formhead .tip2{font-size:11px;color:var(--dim)}
.formframe{flex:1;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:420px}
.lnk{color:var(--bronze);font-weight:700;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:12px;z-index:200;display:none}
.toast.on{display:block}
.modal.rec{width:min(720px,calc(100% - 20px));max-height:calc(100% - 24px);display:flex;flex-direction:column;padding:0;overflow:hidden}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 12px;border-bottom:1px solid var(--line2)}
.rhead p{margin-top:3px}
.rbody{overflow:auto;padding:16px 22px 8px;flex:1}
.rfoot{display:flex;align-items:center;gap:10px;padding:12px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);background:var(--cardSoft)}
.rfoot .err{flex:1;margin:0}
.fld{margin-bottom:16px;min-width:0}
.fld>label{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.frow{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:12px}
.inp{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);min-width:0}
.inp:focus{outline:2px solid rgba(201,154,53,.45);border-color:var(--gold)}
.pick{position:relative}
.plist{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);z-index:5;padding:4px}
.plist.on{display:block}
.pit{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border-radius:9px}
.pit:hover{background:var(--cardSoft)}
.pit small{font-size:11px;color:var(--dim)}
.pit.add span{color:var(--bronze);font-weight:700}
.pnone{padding:12px;color:var(--faint);font-size:12px}
.eqcard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 3px rgba(201,154,53,.12)}
.eqcard .tagt{font-size:15px}
.wchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.wchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-weight:700;font-size:12.5px;color:var(--ink2)}
.wchip i{width:16px;height:16px;border-radius:5px;border:2px solid var(--faint);flex:none}
.wchip.on{border-color:var(--gold);background:rgba(201,154,53,.10);color:var(--bronze)}
.wchip.on i{background:var(--bronze);border-color:var(--bronze);box-shadow:inset 0 0 0 2px #fff}
.lubinfo{font-size:12px;color:var(--ink2);margin-top:8px;min-height:16px}
.lubinfo .sep{margin:0 8px;color:var(--faint)}
.minisegs.big button{padding:8px 12px;font-size:12px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:rgba(154,115,39,.12);color:var(--bronze);border-radius:20px;padding:5px 6px 5px 11px;font-size:11.5px;font-weight:700}
.pchip button{width:18px;height:18px;border-radius:50%;background:rgba(154,115,39,.18);color:var(--bronze);font-size:9px}
.gbtn:disabled{opacity:.6;cursor:wait}
.st-PEND{--pc:var(--slate);--pb:rgba(94,118,137,.13)}
.cbtn{font-size:10.5px;font-weight:700;color:var(--red);border:1px solid rgba(194,81,73,.3);border-radius:8px;padding:3px 8px;margin-top:4px;background:#fff}
.cbtn:hover{background:var(--redSoft)}
@media (max-width:760px){.modal.rec{width:100%;max-height:100%;height:100%;border-radius:0;top:0;left:0;transform:none}.frow{grid-template-columns:1fr 1fr}.frow .fld:last-child{grid-column:1/-1}.rhead,.rbody,.rfoot{padding-left:16px;padding-right:16px}}
.navbtn .bdg.amb{background:var(--amber)}
.rem .due{display:block;white-space:nowrap;font-size:10px;font-weight:600;color:var(--dim);letter-spacing:0;margin-top:1px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--bronze)}
.sheet{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm);padding:26px 28px;animation:rise .4s ease both}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.sh-head h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
.sh-head .sd{font-size:12px;color:var(--dim);margin-top:3px}
.sh-head img{height:40px}
.sh-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sh-sum .sc{border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:110px}
.sh-sum .sc b{display:block;font-family:var(--mono);font-size:22px;font-weight:800;line-height:1.1}
.sh-sum .sc span{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.sh-sec{margin-top:18px;break-inside:avoid-page}
.sh-sec h4{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.02em;padding:7px 10px;background:var(--bg2);border-radius:9px;margin-bottom:4px}
.sh-sec h4 .n{font-family:var(--mono);font-size:11px;background:var(--ink);color:#fff;border-radius:10px;padding:1px 8px}
.sh-sec h4 .lub{margin-left:auto;font-size:11px;font-weight:600;color:var(--dim)}
table.rt{width:100%;border-collapse:collapse;font-size:12px}
table.rt th{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}

.reg{font-family:var(--mono);font-size:10px;color:var(--dim)}
.pc.top{width:290px;border-color:rgba(201,154,53,.45);background:linear-gradient(165deg,#fff,#FBF6EA)}
.pc.top .av{--s:66px}
.pc.hl,.mc.hl{outline:2.5px solid var(--gold);outline-offset:2px}

/* mini cards (team members) */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.mc{display:flex;gap:9px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line2);border-radius:13px;padding:7px 9px 7px 7px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.mc:hover{border-color:rgba(201,154,53,.55);box-shadow:var(--sh-sm)}
.mc .av{--s:42px;border-radius:12px}
.mc .mn{font-size:11.5px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc .ms{display:flex;gap:5px;align-items:center;margin-top:2px}
.mc .ms .reg{font-size:9.5px}
.mc .ms .dotc{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.mc .ms .dotc.loc{background:var(--slate)}
.mc .mt{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tree */
.ocwrap{overflow-x:auto;padding:6px 4px 10px;margin:0 -4px}
.oc{min-width:max-content;margin:0 auto}
.oc ul{display:flex;justify-content:center;padding-top:22px;position:relative;margin:0}
.oc>ul{padding-top:0}
.oc li{list-style:none;position:relative;padding:22px 7px 0;display:flex;flex-direction:column;align-items:center}
.oc li::before,.oc li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid #D6CDBB;width:50%;height:22px}
.oc li::after{right:auto;left:50%;border-left:2px solid #D6CDBB}
.oc li:only-child::before,.oc li:only-child::after{display:none}
.oc li:only-child{padding-top:0}
.oc li:first-child::before,.oc li:last-child::after{border:0 none}
.oc li:last-child::before{border-right:2px solid #D6CDBB;border-radius:0 10px 0 0}
.oc li:first-child::after{border-radius:10px 0 0 0}
.oc ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid #D6CDBB;height:22px}
.oc>ul>li{padding-top:0}
.grp{display:flex;flex-direction:column;align-items:center;gap:8px}
.grp .gl{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);background:var(--bg);padding:0 8px;border-radius:6px}
.grp .gc{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:960px}
.sn{width:176px;background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:16px;padding:12px 12px 11px;box-shadow:var(--sh-sm);cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s}
.sn:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:rgba(201,154,53,.55)}
.sn .snt{font-size:13px;font-weight:800;letter-spacing:-.01em}
.sn .snc{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--bronze);line-height:1.1;margin-top:3px}
.sn .snc small{font-family:var(--sans);font-size:10px;color:var(--dim);font-weight:600;margin-left:3px}
.sn .sns{display:flex;justify-content:center;margin-top:8px}
.sn .sns .av{--s:28px;border-radius:9px;border:2px solid #fff;margin-left:-7px;font-size:10px}
.sn .sns .av:first-child{margin-left:0}
.sn .snl{font-size:10px;color:var(--dim);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* filters */
.fbar{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--sh-sm);margin-top:16px;display:grid;gap:10px}
.fgrp{display:flex;gap:12px;align-items:flex-start;min-width:0}
.fgl{flex:none;width:118px;padding-top:8px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.fopts{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fo{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--ink2);text-align:left;transition:.15s}
.fo b{font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--line2);border-radius:7px;padding:0 6px;line-height:17px}
.fo:hover{border-color:var(--gold);color:var(--bronze)}
.fo.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fo.on b{background:rgba(255,255,255,.18);color:#fff}
.fo.two{padding:5px 10px}
.fo .fo1{display:block;font-size:11.5px;font-weight:800;line-height:1.2}
.fo .fo2{display:block;font-size:9.5px;font-weight:600;color:var(--dim);line-height:1.2}
.fo.two{flex-direction:row}
.fo.two>span:not(.fo1):not(.fo2){display:block}
.fo.on .fo2{color:rgba(255,255,255,.7)}
.fo .fo1+.fo2{margin-top:1px}
.fo.two{display:inline-grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:8px}
.fo.two .fo1{grid-column:1;grid-row:1}.fo.two .fo2{grid-column:1;grid-row:2}.fo.two b{grid-column:2;grid-row:1/3;align-self:center}
.frow2{display:flex;gap:10px 28px;flex-wrap:wrap}
.frow2 .fgrp .fgl{width:auto}
.frow2 .fgrp:first-child .fgl{width:118px}
.otools{margin:12px 0 16px}

/* team blocks */
.sn.tn{width:220px}
.sn.tn .snc{font-size:18px;margin-top:6px}
.sn.tn .sns .av{--s:36px;border-radius:11px}
.sn.tn .snl{font-weight:700;color:var(--ink2);white-space:normal;font-size:10.5px}
.sn.tn.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,154,53,.25)}
.secs{display:grid;gap:18px;margin-top:26px}
.team{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:20px;padding:18px 20px 20px;box-shadow:var(--sh-sm);scroll-margin-top:140px}
.team.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px rgba(201,154,53,.45)}100%{box-shadow:var(--sh-sm)}}
.teamh{display:flex;align-items:flex-end;gap:12px;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.teamh .tk{font-size:9px;font-weight:800;color:var(--bronze)}
.teamh h3{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.teamh .cnt{font-family:var(--mono);font-size:12px;color:var(--dim)}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.sech{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sech h4{font-size:15px;font-weight:800;letter-spacing:-.01em}
.sech .cnt{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.lead{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.rgrp+.rgrp{margin-top:12px}
.rgl{display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.rgl b{font-family:var(--mono);font-size:10px;color:var(--bronze);letter-spacing:0}
.rgl::after{content:"";flex:1;height:1px;background:var(--line2)}
.oc>ul>li::before,.oc>ul>li::after{display:none}
.oc>ul{gap:36px}

/* results (search / missing photo) */
.res{background:linear-gradient(165deg,#fff,var(--cardSoft));border:1px solid var(--line);border-radius:20px;padding:18px 20px 20px;box-shadow:var(--sh-sm)}
.res h3{font-size:15px;font-weight:800;margin-bottom:4px}
.res .rs{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.res .dg+.dg{margin-top:16px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rgrid .pc{width:auto}
.um{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
.um h4{font-size:12px;font-weight:800;margin-bottom:6px}
.um p{font-size:11px;color:var(--dim);margin-bottom:8px}
.um code{display:inline-block;font-family:var(--mono);font-size:10.5px;background:var(--line2);border-radius:6px;padding:2px 7px;margin:0 4px 4px 0}

/* person modal */
.pmod{width:min(520px,calc(100% - 24px));padding:0;overflow:hidden}
.pmh{display:flex;gap:18px;align-items:center;padding:22px 22px 18px;background:radial-gradient(130% 120% at 100% 0%,rgba(201,154,53,.16),transparent 60%),linear-gradient(165deg,#fff,var(--cardSoft));border-bottom:1px solid var(--line)}
.pmh .av{--s:112px;border-radius:26px;box-shadow:var(--sh)}
.pmh h4{font-size:19px;line-height:1.2}
.pmh .pt{font-size:12.5px;color:var(--ink2);margin-top:4px}
.pmh .pm{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pmb{padding:6px 22px 20px}
.pmb .kv{grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.wab{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;border-radius:11px;padding:9px 14px;font-weight:800;font-size:12px;text-decoration:none;box-shadow:0 6px 14px -6px rgba(37,211,102,.7)}
.wab:hover{background:#1EBE5A}
.telb{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:11px;padding:9px 14px;font-weight:800;font-size:12px;text-decoration:none}
.telb:hover{border-color:var(--gold);color:var(--bronze)}
.pmod .xbtn{position:absolute;right:14px;top:14px;float:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .otools .search{max-width:none;flex-basis:100%}
  .pc,.pc.top{width:100%}
  .grp .gc{flex-direction:column;align-items:stretch;width:100%}
  .team{padding:14px 12px 16px;border-radius:16px}
  .mgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .pmh{flex-direction:column;text-align:center}.pmh .pm{justify-content:center}
  .fbar{padding:12px}
  .fgrp{flex-direction:column;gap:6px}.fgl,.frow2 .fgrp:first-child .fgl{width:auto;padding-top:0}
  .ocwrap{overflow:visible;margin:0;padding:0}
  .oc{min-width:0}
  .oc ul,.oc>ul{display:block;padding:0}
  .oc li,.oc>ul>li{padding:0;display:block}
  .oc li::before,.oc li::after,.oc ul ul::before{display:none}
  .oc .grp{width:100%;margin-bottom:12px}
  .oc ul.secrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
  .oc ul.secrow>li{min-width:0}
  .oc ul.secrow>li.mgli{grid-column:1/-1;margin-top:8px}
  .sn,.sn.tn{width:auto}
}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body{font-size:9.5px}
  .hdr,#notices,#loading,.toast,.ov,.otools,.kpis,.fbar,.swtip,#pgUser{display:none!important}
  .wrap{padding:10mm 10mm 8mm!important;max-width:none}
  .printhead{display:flex!important;justify-content:space-between;align-items:center;border-bottom:2px solid #211E18;padding-bottom:7px;margin-bottom:10px}
  .printhead b{display:block;font-size:16px;font-weight:800}.printhead span{font-size:9.5px;color:#4A453C}
  .printhead img{height:34px}
  *{animation:none!important;box-shadow:none!important;transition:none!important}
  .av,.cat,.mc .ms .dotc,.sn,.pc.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* tree: compact, on the first page */
  .ocwrap{overflow:visible;padding:0;margin:0 0 4mm}
  .oc{zoom:.72}
  .pc{transform:none!important}
  /* teams: each on its own page, plain (no boxes that split across pages) */
  .secs{display:block;margin:0}
  .team{border:0;border-radius:0;padding:0;background:none;break-before:page}
  .team:first-child{break-before:auto;margin-top:2mm}
  .teamh{margin-bottom:8px;padding-bottom:5px}
  .teamh h3{font-size:15px}
  .sec{margin-top:8px;padding-top:7px}
  .sech{margin-bottom:5px}.sech h4{font-size:12px}
  .rgl{font-size:7.5px;margin-bottom:4px;break-after:avoid}
  .lead{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}
  .lead .pc,.lead .pc.top{width:auto;padding:5px 6px;gap:6px;border-radius:9px;border:1px solid #DDD6C8;background:#fff}
  .lead .pc .av{--s:34px;border-radius:9px}
  .pc .pn{font-size:9.5px}.pc .pt{font-size:8px;line-height:1.2}.pc .pm{margin-top:2px}.pc .cat{font-size:6.5px}.pc .reg{font-size:7.5px}
  .mgrid{grid-template-columns:repeat(5,1fr);gap:4px}
  .mc{padding:3px 5px 3px 3px;border-radius:8px;border:1px solid #E6E0D4;gap:5px;break-inside:avoid}
  .mc .av{--s:28px;border-radius:7px;font-size:10px}
  .mc .mn{font-size:8.3px;line-height:1.2}.mc .ms .reg{font-size:7px}
  .rgrp+.rgrp{margin-top:6px}
  .pc,.mc,.lead{break-inside:avoid}
  .res{border:0;padding:0;background:none}
  .rgrid{grid-template-columns:repeat(3,1fr);gap:5px}
  .rgrid .pc{padding:5px 6px;border-radius:9px;border:1px solid #DDD6C8}.rgrid .pc .av{--s:32px}
}

#hov{position:fixed;z-index:300;pointer-events:none;display:none;width:236px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 8px 10px;box-shadow:var(--sh-lg);text-align:center}
#hov.on{display:block;animation:apIn .12s ease}
#hov img{display:block;width:220px;height:220px;object-fit:cover;border-radius:13px;background:#F5F2EC}
#hov b{display:block;font-size:13px;font-weight:800;margin-top:8px;line-height:1.25}
#hov span{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.3}
@media print{#hov{display:none!important}}

</style>

// ---------- model: teams by responsible (not by department)
// Planning + Predictive (any department) -> the planning superintendent's team; others -> their department's team
var PLANSEC={PLANNING:1,PREDICTIVE:1},BYK={},TEAMS=[],TBY={},ROOTS=[];
function isPlan(p){return !!PLANSEC[String(p.se||'').toUpperCase().trim()]}

var RULE={
  acLead:'OZCAN YILDIRIM',                                            // A/C sorumlusu (tüm departmanlardaki A/C); Sercan Altınbilek'e bağlı
  kok:{loc:'KOKOYAH',deps:{'CIL PLANT MAINTENANCE SHOP':1,'CRUSHER & CONCRETE PLANTS MAINTENANCE':1},to:'CRUSHER & CONCRETE PLANTS MAINTENANCE'},  // Kokoyah -> Mutlu Yaşa Öztürk
  planFirst:'SEMIH AKSOY'                                             // Planning & Predictive bölümünde en başta

function NU(s){return String(s||'').toUpperCase().trim()}
var ACL=null,PSAL=null;
function isAC(p){return NU(p.se)==='A/C'||p===ACL}
function secOf(p){return isAC(p)?'A/C':(isPlan(p)?'Planning & Predictive':(p.se||'—'))}
function teamOf(p){
  if(isAC(p)&&ACL)return 'D:'+(ACL.d||'—');
  if(isPlan(p))return 'PLAN';                                         // Planning / Predictive her lokasyonda Ömer Özgün'e bağlı
  if(PSAL&&NU(p.se)==='PSA PLANT')return 'D:'+(PSAL.d||'—');            // PSA Plant (Kokoyah dahil) PSA formenine bağlı
  if(NU(p.l)===RULE.kok.loc&&RULE.kok.deps[NU(p.d)])return 'D:'+RULE.kok.to;
  return 'D:'+(p.d||'—')}
function pinned(p){var n=NU(p.n);return n===RULE.planFirst||p===ACL}
// optional Excel column "REPORTS TO" / "BAĞLI OLDUĞU KİŞİ": reg. no or name of the person above
var BYN={},UP={},MGS=[];
function nkey(s){return fold(s).replace(/[^A-Z]/g,'')}
function upOf(p){return UP[key(p)]||null}
function model(){BYK={};BYN={};UP={};TEAMS=[];TBY={};ROOTS=[];
  D.p.forEach(function(p){BYK[key(p)]=p;var n=nkey(p.n);if(n)BYN[n]=(n in BYN)?null:p});
  D.p.forEach(function(p){var v=String(p.rt||'').trim();if(!v)return;var d=v.replace(/\s/g,''),u=null;
    if(/^\d{3,}$/.test(d))u=BYK[d]||null;if(!u)u=BYN[nkey(v)]||null;if(u&&u!==p)UP[key(p)]=u});
  ACL=D.p.filter(function(p){return NU(p.n)===RULE.acLead})[0]||null;
  if(ACL){var acs=D.p.filter(function(p){return rank(p)===1&&NU(p.d)===NU(ACL.d)&&!isPlan(p)})[0];
    if(acs&&!UP[key(ACL)])UP[key(ACL)]=acs;
    D.p.forEach(function(p){if(p!==ACL&&NU(p.se)==='A/C'&&rank(p)>1&&!UP[key(p)])UP[key(p)]=ACL})}
  PSAL=D.p.filter(function(p){return NU(p.se)==='PSA PLANT'&&rank(p)<9}).sort(function(a,b){return rank(a)-rank(b)||byName(a,b)})[0]||null;
  if(PSAL)D.p.forEach(function(p){if(p!==PSAL&&NU(p.se)==='PSA PLANT'&&rank(p)===9&&!UP[key(p)])UP[key(p)]=PSAL});
  var mg=D.p.filter(function(p){return rank(p)===0}).sort(function(a,b){return (/SENIOR/i.test(b.t)-/SENIOR/i.test(a.t))||byName(a,b)}),top=mg[0]||null;
  // team: follow "reports to" up to a superintendent; otherwise Planning/Predictive -> planning team, else department
  D.p.forEach(function(p){if(rank(p)===0){p._t='';return}var u=p,i=0;
    while(u&&rank(u)>1&&i<12){u=upOf(u);i++}
    p._t=(u&&u!==p&&rank(u)===1)?teamOf(u):teamOf(p)});
  D.p.forEach(function(p){if(!p._t)return;var t=TBY[p._t];if(!t){t=TBY[p._t]={k:p._t,leads:[],mem:[],dep:p._t==='PLAN'?'':p._t.slice(2)};TEAMS.push(t)}
    if(rank(p)===1&&teamOf(p)===p._t)t.leads.push(p);else t.mem.push(p)});
  TEAMS.forEach(function(t){t.leads.sort(byName);if(t.k==='PLAN')t.dep=t.leads.length?t.leads[0].d:(t.mem[0]||{}).d;
    var um=t.leads.map(upOf).filter(function(u){return u&&rank(u)===0})[0];
    t.mgr=um||mg.filter(function(m){return m.d===t.dep})[0]||top});
  TEAMS.sort(function(a,b){return (b.mem.length+b.leads.length)-(a.mem.length+a.leads.length)});
  // managers: under the manager they report to; otherwise under the senior manager
  // managers without "reports to": one chain under the senior manager (Bircan -> Emre), all teams under the last one
  var chain=mg.filter(function(m){var u=upOf(m);return !(u&&rank(u)===0&&u!==m)});
  mg.forEach(function(m){var u=upOf(m);if(u&&rank(u)===0&&u!==m)m._pm=u;else{var i=chain.indexOf(m);m._pm=i>0?chain[i-1]:null}});
  var last=chain[chain.length-1]||top;
  TEAMS.forEach(function(t){var um=t.leads.map(upOf).filter(function(u){return u&&rank(u)===0})[0];t.mgr=um||last});
  mg.forEach(function(m){var c=m._pm,i=0;while(c&&i<10){if(c===m){m._pm=null;break}c=c._pm;i++}});
  mg.forEach(function(m){if(!m._pm)ROOTS.push(m)});
  MGS=mg}

function renderChart(){
  if(q)return renderSearch();if(miss)return renderMissing();
  var P=sel(),cnt={};P.forEach(function(p){if(p._t)cnt[p._t]=(cnt[p._t]||0)+1});
  var vis=TEAMS.filter(function(t){return F.team?t.k===F.team:cnt[t.k]>0});
  if(!vis.length){$('chart').innerHTML='<div class="res"><div class="empty">'+esc(T('r_none'))+'</div></div>';return}

  var orph=vis.filter(function(t){return !t.mgr});
  var tree='<ul>'+ROOTS.map(function(m){var x=mnode(m);return x?'<li>'+x+'</li>':''}).join('')+(orph.length?'<li><ul class="secrow">'+orph.map(function(t){return '<li>'+tnode(t,cnt[t.k]||0)+'</li>'}).join('')+'</ul></li>':'')+'</ul>';

    h+='<section class="team" id="tm_'+esc(t.k.replace(/[^A-Za-z0-9]/g,''))+'"><div class="teamh"><div><div class="tk up">'+esc(T('f_team'))+'</div><h3>'+esc(tname(t))+'</h3></div><span class="cnt">'+esc(T('sec_n',{n:cnt[t.k]||0}))+'</span></div>'+
      (t.leads.length?'<div class="rgl">'+esc(T('lead_s'))+'</div><div class="lead">'+t.leads.map(function(p){return pcard(p,true)}).join('')+'</div>':'')+
      order.map(function(s){var L=secs[s].filter(function(p){return rank(p)<9}).sort(leadSort),Mm=secs[s].filter(function(p){return rank(p)===9}),rg={},ro=[];
        Mm.forEach(function(p){var r=NU(p.se)==='PREDICTIVE'?'Predictive':role(p);if(!rg[r]){rg[r]=[];ro.push(r)}rg[r].push(p)});
        ro.sort(function(a,b){return ((b==='Predictive')-(a==='Predictive'))||rg[b].length-rg[a].length||a.localeCompare(b)});
        return '<div class="sec"><div class="sech"><h4 lang="en">'+esc(tc(s))+'</h4><span class="cnt">'+esc(T('sec_n',{n:secs[s].length}))+'</span></div>'+
          (L.length?'<div class="rgl">'+esc(T('leaders'))+' <b>'+L.length+'</b></div><div class="lead">'+L.map(function(p){return pcard(p)}).join('')+'</div>':'')+
          ro.map(function(r){return '<div class="rgrp"><div class="rgl" lang="en">'+esc(r)+' <b>'+rg[r].length+'</b></div><div class="mgrid">'+rg[r].sort(byName).map(mcard).join('')+'</div></div>'}).join('')+'</div>'}).join('')+'</section>'});
  $('chart').innerHTML=h+'</div>'}
function groupByTeam(list){var o={},k=[];list.forEach(function(p){var d=p._t||'MG';if(!o[d]){o[d]=[];k.push(d)}o[d].push(p)});
  return k.map(function(d){return [d==='MG'?T('mgmt'):tname(TBY[d]),o[d]]})}
function fold(s){return String(s||'').toLocaleUpperCase('tr').replace(/İ/g,'I').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'I')}
function renderSearch(){var w=fold(q);var R=sel().filter(function(p){return fold(p.n).indexOf(w)>=0||String(p.r||'').indexOf(q.trim())>=0||fold(p.t).indexOf(w)>=0||fold(p.se).indexOf(w)>=0}).sort(leadSort);
  $('chart').innerHTML='<div class="res"><h3>'+esc(T('r_search'))+'</h3><div class="rs">'+esc(R.length?T('r_found',{n:R.length}):T('r_none'))+'</div>'+
    groupByTeam(R).map(function(g){return '<div class="dg"><div class="rgl">'+esc(g[0])+' <b>'+g[1].length+'</b></div><div class="rgrid">'+g[1].map(function(p){return pcard(p)}).join('')+'</div></div>'}).join('')+'</div>'}
function renderMissing(){var R=sel().filter(function(p){return !p.f}).sort(byName),um=D.um||[];
  $('chart').innerHTML='<div class="res"><h3>'+esc(T('r_miss'))+'</h3><div class="rs">'+esc(R.length?T('r_miss_s',{n:R.length}):T('r_miss_none'))+'</div>'+
    groupByTeam(R).map(function(g){return '<div class="dg"><div class="rgl">'+esc(g[0])+' <b>'+g[1].length+'</b></div><div class="mgrid">'+g[1].map(mcard).join('')+'</div></div>'}).join('')+
    (um.length?'<div class="um"><h4>'+esc(T('um_t',{n:D.nm||um.length}))+'</h4><p>'+esc(T('um_s'))+'</p>'+um.map(function(f){return '<code>'+esc(f)+'</code>'}).join('')+'</div>':'')+'</div>'}
function renderPill(){$('pill').className='datapill live';$('pillA').textContent=T('upd',{d:fdate(D.at)+D.at.slice(10)});if(!PHT&&FH)$('pillB').textContent=T('xl',{d:fdate(D.xt)+String(D.xt||'').slice(10)})}
function render(){if(!D)return;model();if(F.team&&!TBY[F.team])F.team='';renderFilters();renderKpis();renderChart();renderPill();prHead()}
function fsum(){var a=[];if(F.team&&TBY[F.team])a.push(tname(TBY[F.team])+' ('+tleads(TBY[F.team])+')');if(F.loc)a.push(F.loc);if(F.co)a.push(F.co);if(F.cat)a.push(F.cat==='E'?T('expat'):T('local'));
  if(q)a.push('"'+q+'"');if(miss)a.push(T('missing'));return a.length?a.join(' · '):T('f_none')}
function prHead(){var n=sel().length,d=new Date();
  $('phT').textContent=T('ph_title');
  $('phS').textContent=T('ph_sub',{f:fsum(),n:n,x:fdate(D.xt),t:('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()});
  var lg=$('logo');if(lg)$('phLogo').src=lg.src}

function openP(k){hvHide();var p=BYK[k];if(!p)return;var wa=waNum(p.ph),tn=tenure(p.sd);
  function row(l,v){return v?'<dt>'+esc(l)+'</dt><dd>'+v+'</dd>':''}

   '<div class="pmb"><dl class="kv">'+row(T('f_team'),p._t&&TBY[p._t]?esc(tname(TBY[p._t])+' · '+tleads(TBY[p._t])):'')+row(T('f_up'),upOf(p)?'<a class="plink" data-p="'+esc(key(upOf(p)))+'">'+esc(pname(upOf(p)))+'</a>':'')+row(T('f_dn'),(function(){var L=D.p.filter(function(x){return upOf(x)===p}).sort(byName);return L.length?L.slice(0,15).map(function(x){return '<a class="plink" data-p="'+esc(key(x))+'">'+esc(pname(x))+'</a>'}).join(', ')+(L.length>15?' +'+(L.length-15):''):''})())+row(T('f_dep'),esc(depLbl(p.d)))+row(T('f_sec'),esc(tc(secOf(p))))+row(T('f_role'),esc(tc(p.st)))+row(T('f_reg'),'<span class="num">'+esc(p.r)+'</span>')+
   row(T('f_ro'),esc(p.ro))+row(T('f_co'),esc(p.co))+row(T('f_ct'),esc(p.ct))+row(T('f_loc'),esc(tc(p.l)))+row(T('f_sd'),p.sd?esc(fdate(p.sd))+(tn?' <span style="color:var(--dim);font-weight:500">· '+esc(tn)+'</span>':''):'')+
   row(T('f_ph'),p.ph?'<span class="num">'+esc(String(p.ph).replace(/\s+/g,' '))+'</span>':'')+'</dl>'+
   (wa?'<div class="pacts"><a class="wab" href="https://wa.me/'+wa+'" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>'+esc(T('wa'))+'</a>'+
     '<a class="telb" href="tel:+'+wa+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>'+esc(T('call'))+'</a></div>':'')+'</div>';
  $('ov').classList.add('on');$('pmX').onclick=closeP}
function closeP(){$('ov').classList.remove('on')}

// ---------- i18n on static nodes
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(function(n){n.textContent=T(n.getAttribute('data-i'))});
  document.querySelectorAll('[data-ph]').forEach(function(n){n.placeholder=T(n.getAttribute('data-ph'))});
  document.querySelectorAll('.langbtn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===lang)});
  document.title=T('title')+' · '+T('subtitle');render()}

// ---------- crypto + data
function hexb(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
function b64u(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function dec(k,u8){return crypto.subtle.importKey('raw',hexb(k.k),{name:'AES-CBC'},false,['decrypt']).then(function(ck){return crypto.subtle.decrypt({name:'AES-CBC',iv:u8.subarray(0,16)},ck,u8.subarray(16))})}
function notice(t,cls){$('notices').innerHTML=t?'<div class="notice'+(cls?' '+cls:'')+'">ℹ '+esc(t)+'</div>':''}
var loading=false;
function load(){if(loading)return;loading=true;
  fetch('data/org.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(r.status===404){loading=false;$('loading').hidden=true;notice(T('n_nodata'));return}
    if(!r.ok)throw new Error('http');
    return r.json().then(function(W){loading=false;
      if(!W||!W.p){$('loading').hidden=true;if(!D)notice(T('n_prep'));return}   // eski (şifreli) biçim: sistem bilgisayarı yeni biçimi yükleyene kadar
      if(W.at===AT&&D)return;
      D=W;AT=W.at;$('loading').hidden=true;$('main').hidden=false;notice('');render();
      if(W.fh!==FH)loadPhotos(W.fh)})
  }).catch(function(){loading=false;$('loading').hidden=true;if(!D)notice(T('n_net'),'stale');else{$('pill').className='datapill err'}})}
var PHT=null,PHN=0;
function phStat(t){var b=$('pillB');if(b&&D)b.textContent=t||T('xl',{d:fdate(D.xt)+String(D.xt||'').slice(10)})}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
// photos: one file (data/foto.bin); retried until it loads, checked against the hash in org.json
function loadPhotos(fh,force){clearTimeout(PHT);phStat(T('ph_load'));
  fetch('data/foto.bin?v='+encodeURIComponent(fh||'')+(force?'&r='+Date.now():''),{cache:force?'reload':'default'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()})
  .then(function(buf){var chk=(window.crypto&&crypto.subtle&&fh)?crypto.subtle.digest('SHA-256',buf).then(function(h){return hex(h).slice(0,16)===fh}):Promise.resolve(true);
    return chk.then(function(ok){if(!ok)throw new Error('stale');return buf})})
  .then(function(buf){var u=new Uint8Array(buf),dv=new DataView(buf);
    if(String.fromCharCode(u[0],u[1],u[2],u[3])!=='ORGF')throw new Error('format');var n=dv.getInt32(4,true),ix=JSON.parse(new TextDecoder().decode(u.subarray(8,8+n))),base=8+n;
    Object.keys(PHOTO).forEach(function(x){try{URL.revokeObjectURL(PHOTO[x])}catch(e){}});PHOTO={};
    Object.keys(ix).forEach(function(x){var a=ix[x];if(a&&!Array.isArray(a)&&a.value)a=a.value;PHOTO[x]=URL.createObjectURL(new Blob([u.subarray(base+a[0],base+a[0]+a[1])],{type:'image/jpeg'}))});
    FH=fh;PHN=0;PHT=null;render();phStat('');if(!$('ov').classList.contains('on'))return;var m=$('pm').querySelector('.av');if(m)openP(m.getAttribute('data-k'))})
  .catch(function(e){PHN++;var w=Math.min(60,5*PHN);phStat(T('ph_retry',{s:w}));PHT=setTimeout(function(){loadPhotos(fh,true)},w*1000);if(PHN===3)toast(T('n_photo'))})}

// ---------- photo preview on hover (mouse only)
var HV=null;
function hvShow(a,ev){var im=a.querySelector('img');if(!im)return;if(!HV){HV=document.createElement('div');HV.id='hov';document.body.appendChild(HV)}
  var p=BYK[a.getAttribute('data-k')];HV.innerHTML='<img alt="" src="'+im.src+'">'+(p?'<b>'+esc(pname(p))+'</b><span>'+esc(p.t||'')+'</span>':'');HV.className='on';hvMove(ev)}
function hvMove(ev){if(!HV||HV.className!=='on')return;var w=HV.offsetWidth,h=HV.offsetHeight,x=ev.clientX+18,y=ev.clientY+18;
  if(x+w>window.innerWidth-8)x=ev.clientX-w-18;if(y+h>window.innerHeight-8)y=Math.max(8,window.innerHeight-h-8);HV.style.left=x+'px';HV.style.top=y+'px'}
function hvHide(){if(HV)HV.className=''}
if(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.addEventListener('mouseover',function(e){var a=e.target.closest&&e.target.closest('.av.ph');if(a&&!a.closest('#pm'))hvShow(a,e);else if(!(e.target.closest&&e.target.closest('#hov')))hvHide()});
  document.addEventListener('mousemove',hvMove);document.addEventListener('scroll',hvHide,true)}

// ---------- events
document.addEventListener('click',function(e){var t=e.target;
  var b=t.closest('[data-p]');if(b){openP(b.getAttribute('data-p'));return}
  b=t.closest('[data-f]');if(b){var dm=b.getAttribute('data-f'),v=b.getAttribute('data-v');F[dm]=(F[dm]===v?'':v);saveF();render();return}
  b=t.closest('[data-team]');if(b){var k=b.getAttribute('data-team'),s=$('tm_'+k.replace(/[^A-Za-z0-9]/g,''));if(s){s.scrollIntoView({behavior:'smooth',block:'start'});s.classList.remove('flash');void s.offsetWidth;s.classList.add('flash')}return}
  b=t.closest('.kpi[data-act]');if(b){var a=b.getAttribute('data-act');if(a==='M'){miss=!miss;q='';$('q').value=''}else{F.cat=F.cat===a?'':a;saveF()}render();return}
  b=t.closest('.langbtn');if(b){lang=b.getAttribute('data-lang');try{localStorage.setItem('org_lang',lang)}catch(e){}applyLang();return}
  if(t===$('ov'))closeP()});
$('missBtn').onclick=function(){miss=!miss;if(miss){q='';$('q').value='';$('qx').hidden=true}render()};
$('q').oninput=function(){q=this.value.trim();$('qx').hidden=!this.value;if(q)miss=false;render()};
$('qx').onclick=function(){$('q').value='';q='';this.hidden=true;render();$('q').focus()};
$('prBtn').onclick=function(){prHead();window.print()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeP()});
var lg=$('logo');if(lg)lg.onclick=function(){location.href='../'};
applyLang();
load();
setInterval(function(){if(!document.hidden)load()},300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&D)load()});

})();
</script>
